<!doctype html>
<!-- Sea Level Rise: one self-contained file, works offline. Built from tools/kit (kit.css, kit.js, src/sea_level_rise.js); edit those and run "node build.js". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sea Level Rise</title>
<style>

.k-bnote{overflow:auto;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px}
.k-bnote b{color:var(--text)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
.k-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap;background:#35505a;color:#c9ecdf}

.k-q details{font-size:13px;color:var(--muted)}.k-q summary{cursor:pointer;color:var(--warn)}.k-q details ul{padding-left:18px;margin:4px 0}
.k-level{padding-bottom:4px}
.k-tabs button{font-size:13px;padding-left:2px;padding-right:2px}
.k-wsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.k-mcard .btn+.btn,.k-mcard button+button{margin-left:6px}
/* playback-speed control moved into the header (ui.headerSpeed) */
.k-hspeed{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;margin:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

<script>
"use strict";
/* =====================================================================
   K: the small shared toolkit behind the ★ enhanced simulations.
   It builds the page frame (header, stage, chart dock, side panel),
   the sliders and buttons, the live charts, the Investigations cards
   and the Batch run window. Each simulation's own code (below this
   script in the page) holds the science.
   ===================================================================== */
const K = (() => {
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => cssVar("--s" + (i % 6));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Repeatable random numbers: the same seed always gives the same run ----
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * r()); };
    r.int = n => Math.floor(r() * n);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    return r;
  }
  // ---- Simple statistics ----
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length || 1);
  function linfit(pts) { // least-squares straight line through [x,y] points
    const n = pts.length, mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1]));
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    const m = sxy / (sxx || 1); return { m, c: my - m * mx, r: sxy / Math.sqrt((sxx * syy) || 1), n };
  }
  function download(name, text) { const a = $("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const sig = (v, n = 3) => { if (v == null || !isFinite(v)) return "–"; if (v === 0) return "0"; const a = Math.abs(v); if (a >= 1e5 || a < 1e-3) return v.toExponential(n - 1); return String(+v.toPrecision(n)); };

  // ---- Controls ----
  /* Typing a value into a slider: read a displayed value ("2.2 mF", "4.7 × 10⁵ Pa", "£30,000", "−12 °C") as a number,
     then search the slider's positions for the one whose display matches (copes with log scales and unit prefixes). */
  const PRE = { p: 1e-12, n: 1e-9, "μ": 1e-6, "µ": 1e-6, u: 1e-6, m: 1e-3, k: 1e3, M: 1e6, G: 1e9 }, SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function parseVal(text) {
    const t = String(text).replace(/[−–]/g, "-").replace(/[   ]/g, " ");
    const m = t.match(/-?(?:\d{1,3}(?:[, ]\d{3})+|\d+)(?:\.\d+)?|-?\.\d+/);
    if (!m) return null;
    let v = parseFloat(m[0].replace(/[, ]/g, "")), rest = t.slice(m.index + m[0].length);
    const pw = m[0] === "10" && rest.match(/^(?:\^\s*(-?\d+(?:\.\d+)?)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))/);         // a bare power of ten: 10⁻⁹ or 10^6.5
    if (pw) { v = Math.pow(10, pw[1] != null ? +pw[1] : (pw[2][0] === "⁻" ? -1 : 1) * +[...pw[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join("")); rest = rest.slice(pw[0].length); }
    const ex = rest.match(/^\s*(?:[×x*]\s*10\s*(?:\^\s*(-?\d+)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))|[eE]([-+]?\d+))/);
    if (ex) { const p = ex[1] != null ? +ex[1] : ex[3] != null ? +ex[3] : (ex[2][0] === "⁻" ? -1 : 1) * +[...ex[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join(""); v *= Math.pow(10, p); rest = rest.slice(ex[0].length); }
    const wd = rest.match(/^\s*(thousand|million|billion|trillion)\b/i);    // "1 million K"
    if (wd) { v *= { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 }[wd[1].toLowerCase()]; rest = rest.slice(wd[0].length); }
    const pm = !wd && rest.match(/^\s*([pnμµumkMG])(?=[A-Za-zΩ°])/);
    if (pm) v *= PRE[pm[1]];
    return isFinite(v) ? { v, unit: rest } : null;
  }
  // what was typed, in the units on display unless a unit was typed too ("2.2", "2.2 mF" and "1e-6" all work)
  function typedVal(raw, shown) {
    const q = parseVal(raw); if (!q) return null;
    if (/[A-Za-zμµΩ°%£$€]/.test(q.unit)) return q;
    const s = parseVal(shown); return parseVal(raw + (s ? " " + s.unit.trim() : ""));
  }
  function invertSlider(lo, hi, st, g, target) {
    const n = Math.max(1, Math.round((hi - lo) / st)), pos = i => +(lo + i * st).toFixed(10);
    let e0 = 0, e1 = n;                                                       // ends may show words ("off"): step in to the first numbers
    while (e0 < n && g(pos(e0)) == null && e0 < 60) e0++;
    while (e1 > e0 && g(pos(e1)) == null && n - e1 < 60) e1--;
    const a = g(pos(e0)), b = g(pos(e1));
    if (a == null || b == null || a === b) return null;
    const up = b > a;
    if (up ? target < a : target > a) return pos(e0 > 0 ? 0 : e0);
    if (up ? target > b : target < b) return pos(e1 < n ? n : e1);
    let i0 = e0, i1 = e1, v0 = a, v1 = b;
    while (i1 - i0 > 1) { const im = (i0 + i1) >> 1, vm = g(pos(im)); if (vm == null) break; if ((vm < target) === up) { i0 = im; v0 = vm; } else { i1 = im; v1 = vm; } }
    return Math.abs(v0 - target) <= Math.abs(v1 - target) ? pos(i0) : pos(i1);
  }

   SEA LEVEL RISE
   The sea is rising because the world is warming:
     • THERMAL EXPANSION: warmer water takes up more space;
     • melting GLACIERS on land;
     • melting ICE SHEETS on Greenland and Antarctica.
   (Melting sea ice and ice shelves that already float hardly change sea
   level: floating ice already displaces its own weight of water.)
   Even a small rise matters most during STORMS: a storm surge on top of
   a high tide on top of a higher sea. Floods that used to happen once a
   century happen far more often.

  const F = flooding(), { G, H, z } = coast, mw = w * 0.62, mh = h * 0.62, cw = mw / G, ch = mh / H;
  for (let j = 0; j < H; j++) for (let i = 0; i < G; i++) { const zz = z[j * G + i]; let col; if (zz <= F.L.msl) col = "#1c4a7a"; else if (F.flooded(zz, i, F.L.high)) col = "#3a78c0"; else if (F.L.storm != null && F.flooded(zz, i, F.L.storm)) col = "#7fb8ff"; else col = `hsl(${100 - Math.min(60, zz * 8)},${35}%,${22 + Math.min(30, zz * 4)}%)`; c.fillStyle = col; c.fillRect(10 + i * cw, 40 + j * ch, cw + 0.5, ch + 0.5); }
  if (P.wall > 0) { c.strokeStyle = F.L.storm != null && F.L.storm > PLACES[P.place].tide / 2 + P.wall ? "#ff6b81" : "#cfd8ea"; c.lineWidth = 4; c.beginPath(); c.moveTo(10 + 0.18 * mw, 40); c.lineTo(10 + 0.18 * mw, 40 + mh); c.stroke(); c.lineWidth = 1; }
  for (const [i, j] of coast.homes) { const zz = z[j * G + i], fl = F.flooded(zz, i, F.L.high) || (F.L.storm != null && F.flooded(zz, i, F.L.storm)); c.fillStyle = fl ? "#ff6b81" : "#f4f1e8"; c.fillRect(10 + i * cw - 2, 40 + j * ch - 2, 4, 4); }
  TX(c, `${Math.round(P.year)} · ${PLACES[P.place].name} · sea ${(F.L.msl * 100).toFixed(0)} cm above today${P.storm ? ` · 1-in-${P.storm}-year storm` : ""}`, 12, 26, "#eef2f8", "left", "600 13px");
  // key
  let ky = 60; const kx = w * 0.66; for (const [col, t] of [["#1c4a7a", "sea"], ["#3a78c0", "flooded at high tide"], ["#7fb8ff", "flooded in the storm"], ["#ff6b81", "flooded home"], ["#f4f1e8", "home"]]) { c.fillStyle = col; c.fillRect(kx, ky - 9, 12, 12); TX(c, t, kx + 18, ky + 1, "#cfd8ea", "left", "11.5px"); ky += 18; }
  // cross-section along the middle row
  const sy = 40 + mh + 30, sh = h - sy - 20, j0 = Math.round(H * 0.35), X = i => 10 + i * cw, Y = zz => sy + sh * 0.5 - zz * sh / 12;
  c.fillStyle = "#4a3a20"; c.beginPath(); c.moveTo(X(0), sy + sh); for (let i = 0; i < G; i++) c.lineTo(X(i), Y(z[j0 * G + i])); c.lineTo(X(G), sy + sh); c.fill();
  const lev = F.L.storm != null ? F.L.storm : F.L.high; c.fillStyle = "rgba(90,160,255,.45)"; c.beginPath(); c.moveTo(X(0), Y(lev)); for (let i = 0; i < G; i++) { const zz = z[j0 * G + i]; c.lineTo(X(i), Y(Math.max(zz, F.flooded(zz, i, lev) ? lev : zz))); } c.lineTo(X(G), sy + sh); c.lineTo(X(0), sy + sh); c.fill();
  if (P.wall > 0) { c.fillStyle = "#cfd8ea"; c.fillRect(X(0.18 * G) - 3, Y(PLACES[P.place].tide / 2 + P.wall), 6, Y(z[j0 * G + Math.round(0.18 * G)]) - Y(PLACES[P.place].tide / 2 + P.wall)); }
  TX(c, "cross-section (vertical scale exaggerated)", 12, sy - 6, "#8fa0bf", "left", "11px");
}

// ---------------- Charts and readings ----------------
function charts() {
  const pts = proj.filter((q, i) => i % 4 === 0), now = at(proj, P.year), cm = v => v / 10;
  chA.opts.title = "Sea level since 1900 (stacked by cause)"; chA.opts.xLabel = "year"; chA.opts.yLabel = "cm above 1900";
  chA.draw([{ pts: pts.map(q => [q.y, cm(q.th)]), type: "area", color: "#5ad1ff", label: "thermal" }, { pts: pts.map(q => [q.y, cm(q.th + q.gl)]), type: "area", color: "#7ee787", label: "glaciers" }, { pts: pts.map(q => [q.y, cm(q.th + q.gl + q.gr)]), type: "area", color: "#ffd166", label: "Greenland" }, { pts: pts.map(q => [q.y, cm(q.tot)]), type: "area", color: "#ff8a70", label: "Antarctica" }, { pts: [[1900, 0], [1950, 5.5], [1993, 13], [2010, 17.5], [2023, 22]], type: "dots", r: 4, color: "#fff", label: "measured (approx.)" }], { xMin: 1900, xMax: 2300, yMin: 0, vlines: [{ x: P.year, label: "now" }] });
  chB.opts.title = "Warming pathway"; chB.opts.xLabel = "year"; chB.opts.yLabel = "°C above pre-industrial"; chB.draw(Object.keys(SCEN).map((s, i) => ({ pts: Array.from({ length: 81 }, (_, k) => [1900 + k * 5, temp(1900 + k * 5, s)]), color: s === P.scen ? "#ff8a70" : "rgba(160,170,190,.35)", label: s === P.scen ? SCEN[s].name : "" })), { xMin: 1900, xMax: 2300, yMin: 0, vlines: [{ x: P.year }] });
  const F = flooding(), rate = (at(proj, P.year).tot - at(proj, P.year - 10).tot) / 10;
  read.set("sl", cm(now.tot).toFixed(1) + " cm"); read.set("rate", rate.toFixed(1) + " mm per year"); read.set("parts", `${cm(now.th).toFixed(0)} · ${cm(now.gl).toFixed(0)} · ${cm(now.gr).toFixed(0)} · ${cm(now.an).toFixed(0)} cm`); read.set("T", now.T.toFixed(2) + " °C");
  read.set("fl", `${(F.hi * 100).toFixed(1)}% · ${(F.st * 100).toFixed(1)}%`); read.set("hm", `${F.homes} of ${coast.homes.length} (≈ ${Math.round(F.homes / coast.homes.length * PLACES[P.place].people).toLocaleString()} people)`);
  const s = (at(proj, P.year).tot - at(proj, 2024).tot) / 1000, f = pExceed(returnLevel(100) - s); read.set("f100", s <= 0 ? "once in 100 years" : `about every ${Math.max(1, 1 / f).toFixed(0)} years (${(f / 0.01).toFixed(1)} × more often)`);
  ui.hud(P.ice ? "Only ice on land raises sea level" : P.storm ? "A storm surge on top of a high tide on top of a higher sea" : "Thermal expansion + melting land ice");
}
let frame = 0;
ui.run(dt => { if (!(dt > 0)) return; iceT += dt; if (run && !P.ice) { P.year = Math.min(2300, P.year + dt * P.speed); if (frame % 10 === 0) ctl.year.set(Math.round(P.year)); if (P.year >= 2300) run = false; } }, () => { draw(); if (frame++ % 6 === 0) charts(); });
set({});
ui.tip("Press ▶ Run on to move forward in time. Try a storm, a sea wall and the ice demo.", 6000);
</script>
