<!doctype html>
<!-- Turing Patterns: one self-contained file, works offline. Built from tools/kit (kit.css, kit.js, src/turing_patterns.js); edit those and run "node build.js". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turing Patterns</title>
<style>

  --shadow:0 10px 30px rgba(0,0,0,.45); --r:12px;
}
:root[data-theme=light]{

.k-idea{font-size:13px;margin:0 0 8px;line-height:1.4}.k-spec{font-size:12px;color:var(--muted);margin:0 0 10px}
.k-pane>h3{font-size:14px;margin:14px 0 8px;color:var(--accent)}
.k-q h4{font-size:12px}.k-q .k-marks{margin-left:auto;color:var(--muted);font-weight:400}.k-q p{color:var(--text);font-size:13.5px}
.k-q details{font-size:13px;color:var(--muted)}.k-q summary{cursor:pointer;color:var(--warn)}.k-q details ul{padding-left:18px;margin:4px 0}
.k-level{padding-bottom:4px}
.k-tabs button{font-size:13px;padding-left:2px;padding-right:2px}
.k-wsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.k-mcard .btn+.btn,.k-mcard button+button{margin-left:6px}
/* playback-speed control moved into the header (ui.headerSpeed) */
.k-hspeed{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;margin:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

.k-hspeed .k-ctl.k-hoff{display:none}
.k-hspeed .k-ctl label{display:contents}
.k-hspeed .k-ctl label span{order:0;font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.k-hspeed .k-ctl input[type=range]{order:1;width:96px}
.k-hspeed .k-ctl label b,.k-hspeed .k-typebox{order:2;font-size:12.5px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.k-hspeed .k-typebox{width:6.5em}
.k-hspeed .k-hunit{order:3;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.k-hspeed .k-ctl>small{display:none}
.k-hspeed .k-seg{order:1;flex-wrap:nowrap;gap:3px}
.k-hspeed .k-seg .k-btn{flex:none;padding:3px 8px;font-size:12px}
.k-group.k-emptied{display:none}
@media (max-width:1400px){.k-blurb{display:none}.k-top:has(.k-hspeed:not([style*="none"])) .k-chip{display:none}}

<script>
"use strict";
/* =====================================================================
   K: the small shared toolkit behind the ★ enhanced simulations.
   It builds the page frame (header, stage, chart dock, side panel),
   the sliders and buttons, the live charts, the Investigations cards
   and the Batch run window. Each simulation's own code (below this
   script in the page) holds the science.
   ===================================================================== */
const K = (() => {
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => cssVar("--s" + (i % 6));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Repeatable random numbers: the same seed always gives the same run ----
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * r()); };
    r.int = n => Math.floor(r() * n);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    return r;
  }
  // ---- Simple statistics ----
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length || 1);
  function linfit(pts) { // least-squares straight line through [x,y] points
    const n = pts.length, mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1]));
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    const m = sxy / (sxx || 1); return { m, c: my - m * mx, r: sxy / Math.sqrt((sxx * syy) || 1), n };
  }
  function download(name, text) { const a = $("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const sig = (v, n = 3) => { if (v == null || !isFinite(v)) return "–"; if (v === 0) return "0"; const a = Math.abs(v); if (a >= 1e5 || a < 1e-3) return v.toExponential(n - 1); return String(+v.toPrecision(n)); };

  // ---- Controls ----
  /* Typing a value into a slider: read a displayed value ("2.2 mF", "4.7 × 10⁵ Pa", "£30,000", "−12 °C") as a number,
     then search the slider's positions for the one whose display matches (copes with log scales and unit prefixes). */
  const PRE = { p: 1e-12, n: 1e-9, "μ": 1e-6, "µ": 1e-6, u: 1e-6, m: 1e-3, k: 1e3, M: 1e6, G: 1e9 }, SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function parseVal(text) {
    const t = String(text).replace(/[−–]/g, "-").replace(/[   ]/g, " ");
    const m = t.match(/-?(?:\d{1,3}(?:[, ]\d{3})+|\d+)(?:\.\d+)?|-?\.\d+/);
    if (!m) return null;
    let v = parseFloat(m[0].replace(/[, ]/g, "")), rest = t.slice(m.index + m[0].length);
    const pw = m[0] === "10" && rest.match(/^(?:\^\s*(-?\d+(?:\.\d+)?)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))/);         // a bare power of ten: 10⁻⁹ or 10^6.5
    if (pw) { v = Math.pow(10, pw[1] != null ? +pw[1] : (pw[2][0] === "⁻" ? -1 : 1) * +[...pw[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join("")); rest = rest.slice(pw[0].length); }
    const ex = rest.match(/^\s*(?:[×x*]\s*10\s*(?:\^\s*(-?\d+)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))|[eE]([-+]?\d+))/);
    if (ex) { const p = ex[1] != null ? +ex[1] : ex[3] != null ? +ex[3] : (ex[2][0] === "⁻" ? -1 : 1) * +[...ex[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join(""); v *= Math.pow(10, p); rest = rest.slice(ex[0].length); }
    const wd = rest.match(/^\s*(thousand|million|billion|trillion)\b/i);    // "1 million K"
    if (wd) { v *= { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 }[wd[1].toLowerCase()]; rest = rest.slice(wd[0].length); }
    const pm = !wd && rest.match(/^\s*([pnμµumkMG])(?=[A-Za-zΩ°])/);
    if (pm) v *= PRE[pm[1]];
    return isFinite(v) ? { v, unit: rest } : null;
  }
  // what was typed, in the units on display unless a unit was typed too ("2.2", "2.2 mF" and "1e-6" all work)
  function typedVal(raw, shown) {
    const q = parseVal(raw); if (!q) return null;
    if (/[A-Za-zμµΩ°%£$€]/.test(q.unit)) return q;
    const s = parseVal(shown); return parseVal(raw + (s ? " " + s.unit.trim() : ""));
  }
  function invertSlider(lo, hi, st, g, target) {
    const n = Math.max(1, Math.round((hi - lo) / st)), pos = i => +(lo + i * st).toFixed(10);
    let e0 = 0, e1 = n;                                                       // ends may show words ("off"): step in to the first numbers
    while (e0 < n && g(pos(e0)) == null && e0 < 60) e0++;
    while (e1 > e0 && g(pos(e1)) == null && n - e1 < 60) e1--;
    const a = g(pos(e0)), b = g(pos(e1));
    if (a == null || b == null || a === b) return null;
    const up = b > a;
    if (up ? target < a : target > a) return pos(e0 > 0 ? 0 : e0);
    if (up ? target > b : target < b) return pos(e1 < n ? n : e1);
    let i0 = e0, i1 = e1, v0 = a, v1 = b;
    while (i1 - i0 > 1) { const im = (i0 + i1) >> 1, vm = g(pos(im)); if (vm == null) break; if ((vm < target) === up) { i0 = im; v0 = vm; } else { i1 = im; v1 = vm; } }
    return Math.abs(v0 - target) <= Math.abs(v1 - target) ? pos(i0) : pos(i1);
  }
  // try every position (cheap here: only the format function runs) and take the closest display; ties go to the one nearest the current setting
  function nearestSlider(lo, hi, st, g, target, cur) {
    const n = Math.max(1, Math.round((hi - lo) / st)); if (n > 20000) return invertSlider(lo, hi, st, g, target);
    let best = null, be = Infinity, bd = Infinity;
    for (let i = 0; i <= n; i++) { const p = +(lo + i * st).toFixed(10), v = g(p); if (v == null) continue; const e = Math.abs(v - target), d = Math.abs(p - cur); if (e < be - 1e-12 * Math.abs(target) || (Math.abs(e - be) <= 1e-12 * Math.abs(target) && d < bd)) { best = p; be = e; bd = d; } }
    return best;
  }
  const scratch = document.createElement("div");

ctl.pal = K.seg(g, { label: "Colours", value: "leopard", options: [["leopard", "leopard"], ["zebra", "zebra"], ["giraffe", "giraffe"], ["coral", "coral"]], on: v => { pal = v; ctl.pal2.set(""); } });
ctl.pal2 = K.seg(g, { value: "", options: [["fish", "fish"], ["cells", "cells"], ["ink", "ink"], ["heat", "heat"]], on: v => { pal = v; ctl.pal.set(""); } });
ctl.speed = K.slider(g, { label: "Speed", min: 1, max: 30, step: 1, value: speed, fmt: v => v + " steps a frame", on: v => speed = v });
ui.headerSpeed(ctl.speed);   // playback speed lives in the header, beside Pause and Reset
const read = K.readout(g, [["n", "separate patches"], ["cover", "skin covered"], ["sp", "typical spacing"], ["big", "in the biggest patch"], ["t", "time"]]);
function set(o) {
  const q = PRESETS[o.preset]; skin.F = q.F; skin.k = q.k; ctl.F.set(q.F); ctl.k.set(q.k); pal = o.pal || q.pal; ctl.pal.set(""); ctl.pal2.set(""); (["leopard", "zebra", "giraffe", "coral"].includes(pal) ? ctl.pal : ctl.pal2).set(pal);
  skin.ratio = 2; ctl.ratio.set(2); skin.scale = o.scale || 1; ctl.scale.set(skin.scale); skin.grad = !!o.grad; ctl.grad.set(skin.grad); setShape(o.shape || "sheet"); ctl.shape.set(shape); brush = "add"; ctl.brush.set("add"); restart(q.start || "");
}

// ---------------- Drawing ----------------
// each colour scheme: background (no activator) to foreground (lots), through a middle colour
const PALS = { leopard: [[224, 172, 88], [150, 92, 30], [26, 16, 8]], zebra: [[244, 242, 236], [120, 118, 112], [14, 14, 16]], giraffe: [[240, 224, 184], [200, 140, 70], [120, 62, 22]], coral: [[10, 40, 70], [230, 110, 120], [255, 220, 200]], fish: [[250, 214, 60], [60, 120, 160], [16, 30, 70]], cells: [[8, 16, 30], [40, 160, 150], [190, 255, 220]], ink: [[246, 244, 238], [150, 150, 170], [30, 30, 60]], heat: [[6, 8, 20], [200, 50, 60], [255, 230, 120]] };
const cv = ui.canvas(() => { });
const img = document.createElement("canvas"); img.width = GW; img.height = GH; const ictx = img.getContext("2d"), idata = ictx.createImageData(GW, GH);
function draw() {
  const c = cv.ctx, w = cv.w, h = cv.h, P = PALS[pal], d = idata.data, v = skin.v, m = skin.mask;
  for (let i = 0, j = 0; i < GW * GH; i++, j += 4) {
    if (m && !m[i]) { d[j] = 8; d[j + 1] = 12; d[j + 2] = 22; d[j + 3] = 255; continue; }
    let t = v[i] * 3.2; if (t > 1) t = 1; const a = t < 0.5 ? P[0] : P[1], b = t < 0.5 ? P[1] : P[2], f = t < 0.5 ? t * 2 : t * 2 - 1;
    d[j] = a[0] + (b[0] - a[0]) * f; d[j + 1] = a[1] + (b[1] - a[1]) * f; d[j + 2] = a[2] + (b[2] - a[2]) * f; d[j + 3] = 255;
  }
  ictx.putImageData(idata, 0, 0); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high"; c.drawImage(img, 0, 0, w, h);
  if (skin.grad) { c.fillStyle = "rgba(255,255,255,.85)"; c.font = "600 12px Segoe UI,sans-serif"; c.textAlign = "center"; c.fillText("kill rate rises →", w / 2, h - 10); c.save(); c.translate(14, h / 2); c.rotate(-Math.PI / 2); c.fillText("feed rate rises →", 0, 0); c.restore(); }
  c.strokeStyle = "rgba(255,255,255,.35)"; c.setLineDash([4, 6]); c.lineWidth = 1; c.beginPath(); c.moveTo(0, probeY / GH * h); c.lineTo(w, probeY / GH * h); c.stroke(); c.setLineDash([]);
}
const paint = p => { const x = p.x / cv.w * GW, y = p.y / cv.h * GH; probeY = K.clamp(Math.round(y), 0, GH - 1); if (brush === "add") skin.blob(x, y, 3.5); else skin.wipe(x, y, 12); };
K.pointer(cv.el, { down: paint, drag: paint, hover(p) { probeY = K.clamp(Math.round(p.y / cv.h * GH), 0, GH - 1); } });

// the map of the two rates, in the dock: click it to jump to a new pair of rates
const mapBox = K.$("div", "k-chart"); ui.dock.append(mapBox); const mp = K.canvas(mapBox, () => { });
const K0 = 0.04, K1 = 0.072, F0 = 0, F1 = 0.09;
function drawMap() {
  const c = mp.ctx, w = mp.w, h = mp.h, L = 48, T = 24, B = 30, R = 12, pw = w - L - R, ph = h - T - B, X = k => L + (k - K0) / (K1 - K0) * pw, Y = F => T + ph - (F - F0) / (F1 - F0) * ph;
  c.fillStyle = K.cssVar("--panel"); c.fillRect(0, 0, w, h); c.fillStyle = K.cssVar("--text"); c.font = "600 12px Segoe UI,sans-serif"; c.textAlign = "left"; c.fillText("Where you are on the map of patterns (click to move)", L, 14);
  c.fillStyle = "rgba(120,140,180,.10)"; c.fillRect(L, T, pw, ph); c.strokeStyle = K.cssVar("--muted"); c.strokeRect(L + .5, T + .5, pw, ph);
  // to the right of this curve the activator always dies out: k = √F / 2 − F
  c.fillStyle = "rgba(255,255,255,.07)"; c.beginPath(); c.moveTo(X(K1), Y(F0)); for (let F = 0; F <= F1; F += 0.002) c.lineTo(Math.min(X(K1), X(Math.sqrt(F) / 2 - F)), Y(F)); c.lineTo(X(K1), Y(F1)); c.fill();
  c.strokeStyle = "#ff9d8a"; c.lineWidth = 1.5; c.beginPath(); let pen = false; for (let F = 0.001; F <= F1; F += 0.002) { const k = Math.sqrt(F) / 2 - F; if (k < K0 || k > K1) { pen = false; continue; } pen ? c.lineTo(X(k), Y(F)) : c.moveTo(X(k), Y(F)); pen = true; } c.stroke();
  c.font = "10.5px Segoe UI,sans-serif"; c.fillStyle = "#ff9d8a"; c.textAlign = "right"; c.fillText("activator dies out", X(K1) - 4, Y(0.012));
  for (const q of Object.values(PRESETS)) { c.fillStyle = "rgba(200,212,235,.75)"; c.beginPath(); c.arc(X(q.k), Y(q.F), 3, 0, 6.3); c.fill(); c.textAlign = q.k > 0.062 ? "right" : "left"; c.fillText(q.name.toLowerCase(), X(q.k) + (q.k > 0.062 ? -6 : 6), Y(q.F) + 3.5); }
  if (skin.grad) { c.strokeStyle = "#7fe3ff"; c.setLineDash([4, 4]); c.strokeRect(X(0.045), Y(0.082), X(0.071) - X(0.045), Y(0.012) - Y(0.082)); c.setLineDash([]); } else { c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.arc(X(skin.k), Y(skin.F), 6, 0, 6.3); c.stroke(); }
  c.fillStyle = K.cssVar("--muted"); c.textAlign = "center"; c.font = "11px Segoe UI,sans-serif"; c.fillText("kill rate →", L + pw / 2, h - 8); for (const k of [0.045, 0.055, 0.065]) c.fillText(k.toFixed(3), X(k), h - 19); c.save(); c.translate(12, T + ph / 2); c.rotate(-Math.PI / 2); c.fillText("feed rate →", 0, 0); c.restore(); c.textAlign = "right"; for (const F of [0.02, 0.04, 0.06, 0.08]) c.fillText(F.toFixed(2), L - 4, Y(F) + 4);
  mp.map = { L, T, pw, ph };
}
K.pointer(mp.el, { down(p) { const q = mp.map; if (!q) return; const k = K0 + (p.x - q.L) / q.pw * (K1 - K0), F = F0 + (1 - (p.y - q.T) / q.ph) * (F1 - F0); if (k < K0 || k > K1 || F < 0.008 || F > 0.085) return; skin.k = Math.round(k * 2000) / 2000; skin.F = Math.round(F * 2000) / 2000; ctl.k.set(skin.k); ctl.F.set(skin.F); skin.grad = false; ctl.grad.set(false); } });
const chP = K.chart(ui.dock, { title: "The two chemicals along the dotted line", xLabel: "position across the skin", yLabel: "amount", yMin: 0, yMax: 1.05 });

// ---------------- The loop ----------------
let frame = 0;
ui.run(() => { skin.step(speed); }, () => {
  draw(); if (frame++ % 6) return; drawMap();
  const row = probeY * GW, U = [], V = []; for (let x = 0; x < GW; x++) { U.push([x, skin.u[row + x]]); V.push([x, skin.v[row + x]]); }
  chP.draw([{ pts: U, color: K.cssVar("--s0"), label: "fuel, U" }, { pts: V, color: K.cssVar("--s1"), label: "activator, V", width: 2.2 }], { xMin: 0, xMax: GW });
  if (frame % 30 === 1) lastM = skin.measure();
  read.set("n", lastM.patches); read.set("cover", lastM.cover.toFixed(0) + "%"); read.set("sp", lastM.patches > 3 ? lastM.spacing.toFixed(1) + " squares" : "–"); read.set("big", lastM.biggest.toFixed(0) + "% of the activator"); read.set("t", skin.t + " steps");
  ui.hud(skin.grad ? "kill rate rises left to right, feed rate bottom to top" : `<b style="font-size:14px">${lastM.patches} patch${lastM.patches === 1 ? "" : "es"}</b> · ${lastM.cover.toFixed(0)}% covered<br>feed ${skin.F.toFixed(4)} · kill ${skin.k.toFixed(4)}`);
});
set({ preset: "spots" });
ui.tip("Every square follows the same two rules · drag on the skin to add activator", 8000);
</script>
</body></html>
