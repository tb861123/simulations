<!doctype html>
<!-- Nuclear Fusion: one self-contained file, works offline. Built from tools/kit (kit.css, kit.js, src/nuclear_fusion.js); edit those and run "node build.js". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuclear Fusion</title>
<style>
/* ===== Enhanced (kit-built) simulations: shared look and feel (inlined into every page by build.js) ===== */
:root{
  --bg:#0a0f1c; --panel:#111a2c; --panel2:#17223a; --line:#24324f; --text:#e9eef8; --muted:#8fa0bf; --grid:#1f2c47;

  --s0:#5ad1ff; --s1:#ffb454; --s2:#7ee787; --s3:#ff7b9c; --s4:#c4a1ff; --s5:#ffe66d;
  --shadow:0 10px 30px rgba(0,0,0,.45); --r:12px;
}
:root[data-theme=light]{
  --bg:#eef2f8; --panel:#ffffff; --panel2:#f3f6fb; --line:#d5dceb; --text:#172033; --muted:#5d6b85; --grid:#e3e8f2;
  --accent:#0b7fc2; --accent-ink:#ffffff; --good:#12924c; --warn:#b86a00; --bad:#d1344d;
  --s0:#0b7fc2; --s1:#d97a00; --s2:#1b9e4b; --s3:#d6336c; --s4:#7048c8; --s5:#a08800;
  --shadow:0 8px 24px rgba(30,50,90,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}

.k-home{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}.k-home:hover{color:var(--accent)}
.k-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.k-title h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.k-chip{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px;white-space:nowrap;align-self:center}
.k-blurb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-actions{display:flex;gap:6px;flex:none;align-items:center}
.k-btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:.12s;user-select:none}
.k-btn:hover{border-color:var(--accent);color:var(--accent)}
.k-btn:active{transform:translateY(1px)}
.k-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.k-btn.primary:hover{filter:brightness(1.1);color:var(--accent-ink)}
.k-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.k-btn.small{padding:3px 9px;font-size:12.5px}
.k-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.k-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.k-left{display:flex;flex-direction:column;min-width:0;min-height:0}
.k-stage{flex:1;position:relative;min-height:0;background:#060a14;overflow:hidden}
.k-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.k-dock{flex:none;height:190px;display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.k-dock:empty{display:none}
.k-dock>*{flex:1;min-width:0;background:var(--panel)}
.k-chart{position:relative;height:100%;min-height:80px}
.k-chart canvas{position:absolute;inset:0;width:100%;height:100%}
.k-side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.k-tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.k-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--muted);font-weight:600}
.k-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.k-pane{flex:1;overflow-y:auto;padding:12px 14px 20px;display:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.k-pane.on{display:block}
.k-group{margin-bottom:14px}
.k-group>h3{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:0 0 8px;font-weight:700}
.k-ctl{margin-bottom:10px}
.k-ctl label{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:2px}
.k-ctl label b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.k-ctl label b.k-typein{cursor:text;border-bottom:1px dashed currentColor;padding:0 1px}
.k-ctl label b.k-typein:hover,.k-ctl label b.k-typein:focus{outline:1px solid var(--accent);outline-offset:1px;border-radius:3px}
.k-typebox{width:9em;font:inherit;font-size:12.5px;padding:1px 4px;border-radius:4px;border:1px solid var(--accent);background:var(--panel-2,#1b2438);color:var(--text)}
.k-ctl small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6.5px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.k-seg{display:flex;flex-wrap:wrap;gap:4px}
.k-seg .k-btn{flex:1 1 auto;padding:5px 8px;font-size:13px;text-align:center}
.k-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.k-row .k-btn{flex:1 1 auto;text-align:center}
.k-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;margin-bottom:9px;font-size:13px;user-select:none}
.k-toggle i{flex:none;width:34px;height:19px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.k-toggle i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.15s}
.k-toggle.on i{background:var(--accent)}.k-toggle.on i::after{left:17px;background:var(--accent-ink)}
.k-read{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.k-read div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.k-read span{display:block;font-size:11px;color:var(--muted)}
.k-read b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:650}
.k-mcard{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:11px 12px;margin-bottom:10px}
.k-mcard h4{margin:0 0 4px;font-size:14.5px;display:flex;gap:8px;align-items:center}
.k-mcard h4 em{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.k-mcard.done h4 em{background:var(--good);color:#04130a}
.k-mcard p{margin:0 0 8px;color:var(--muted);font-size:13px}
.k-banner{position:absolute;left:12px;top:12px;max-width:min(520px,70%);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--accent);border-radius:var(--r);padding:10px 34px 10px 13px;box-shadow:var(--shadow);z-index:5;backdrop-filter:blur(6px);font-size:13.5px}
.k-banner b{color:var(--accent)}
.k-banner .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--muted);background:none;border:0;font-size:16px}
.k-banner details{margin-top:6px;color:var(--muted)}.k-banner summary{cursor:pointer;color:var(--warn)}
.k-tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(8,14,26,.82);color:#dfe8f7;border:1px solid #2b3a5c;border-radius:99px;padding:6px 16px;font-size:13px;pointer-events:none;z-index:4;transition:opacity .6s;white-space:nowrap}
.k-hud{position:absolute;right:12px;top:12px;background:rgba(8,14,26,.72);color:#dfe8f7;border:1px solid #2b3a5c;border-radius:10px;padding:7px 11px;font-size:12.5px;z-index:3;pointer-events:none;font-variant-numeric:tabular-nums;line-height:1.5;text-align:right}
.k-notes h3{font-size:14px;margin:14px 0 4px;color:var(--accent)}.k-notes h3:first-child{margin-top:0}
.k-notes p,.k-notes li{font-size:13px;color:var(--text)}.k-notes ul{padding-left:18px;margin:4px 0}
.k-notes code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.k-overlay{position:fixed;inset:0;background:rgba(3,6,12,.7);display:none;z-index:50;backdrop-filter:blur(3px)}
.k-overlay.on{display:grid;place-items:center}
.k-modal{width:min(1180px,95vw);height:min(700px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.k-blist{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.k-blist h2{font-size:16px;margin:0 0 4px}.k-blist>p{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.k-bitem{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.k-bitem.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.k-bitem b{display:block;font-size:13.5px}.k-bitem span{color:var(--muted);font-size:12.5px}
.k-bmain{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px}
.k-bhead{display:flex;gap:10px;align-items:flex-start}
.k-bhead h3{margin:0;font-size:17px;flex:1}.k-bhead p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:400}
.k-bbar{display:flex;gap:10px;align-items:center;margin:10px 0 8px}
.k-prog{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.k-prog i{display:block;height:100%;width:0;background:var(--accent)}
.k-bchart{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.k-bfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;height:150px;margin-top:10px}
.k-btable{overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.k-btable table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.k-btable th,.k-btable td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
.k-btable th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600}
.k-bnote{overflow:auto;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px}
.k-bnote b{color:var(--text)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
.k-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap;background:#35505a;color:#c9ecdf}
.k-tag.adv{background:#4b3a78;color:#e3d6ff}.k-tag.beyond{background:#39465c;color:#cfdaf0}
.k-idea{font-size:13px;margin:0 0 8px;line-height:1.4}.k-spec{font-size:12px;color:var(--muted);margin:0 0 10px}
.k-pane>h3{font-size:14px;margin:14px 0 8px;color:var(--accent)}
.k-q h4{font-size:12px}.k-q .k-marks{margin-left:auto;color:var(--muted);font-weight:400}.k-q p{color:var(--text);font-size:13.5px}
.k-q details{font-size:13px;color:var(--muted)}.k-q summary{cursor:pointer;color:var(--warn)}.k-q details ul{padding-left:18px;margin:4px 0}
.k-level{padding-bottom:4px}
.k-tabs button{font-size:13px;padding-left:2px;padding-right:2px}
.k-wsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.k-mcard .btn+.btn,.k-mcard button+button{margin-left:6px}
/* playback-speed control moved into the header (ui.headerSpeed) */
.k-hspeed{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;margin:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.k-hspeed .k-ctl{display:flex;align-items:center;gap:7px;margin:0}
.k-hspeed .k-ctl.k-hoff{display:none}
.k-hspeed .k-ctl label{display:contents}
.k-hspeed .k-ctl label span{order:0;font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.k-hspeed .k-ctl input[type=range]{order:1;width:96px}
.k-hspeed .k-ctl label b,.k-hspeed .k-typebox{order:2;font-size:12.5px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.k-hspeed .k-typebox{width:6.5em}
.k-hspeed .k-hunit{order:3;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.k-hspeed .k-ctl>small{display:none}
.k-hspeed .k-seg{order:1;flex-wrap:nowrap;gap:3px}
.k-hspeed .k-seg .k-btn{flex:none;padding:3px 8px;font-size:12px}
.k-group.k-emptied{display:none}
@media (max-width:1400px){.k-blurb{display:none}.k-top:has(.k-hspeed:not([style*="none"])) .k-chip{display:none}}
</style></head><body>
<script>
"use strict";
/* =====================================================================
   K: the small shared toolkit behind the ★ enhanced simulations.
   It builds the page frame (header, stage, chart dock, side panel),
   the sliders and buttons, the live charts, the Investigations cards
   and the Batch run window. Each simulation's own code (below this
   script in the page) holds the science.
   ===================================================================== */
const K = (() => {
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => cssVar("--s" + (i % 6));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Repeatable random numbers: the same seed always gives the same run ----
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * r()); };
    r.int = n => Math.floor(r() * n);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    return r;
  }
  // ---- Simple statistics ----
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length || 1);
  function linfit(pts) { // least-squares straight line through [x,y] points
    const n = pts.length, mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1]));
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    const m = sxy / (sxx || 1); return { m, c: my - m * mx, r: sxy / Math.sqrt((sxx * syy) || 1), n };
  }
  function download(name, text) { const a = $("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const sig = (v, n = 3) => { if (v == null || !isFinite(v)) return "–"; if (v === 0) return "0"; const a = Math.abs(v); if (a >= 1e5 || a < 1e-3) return v.toExponential(n - 1); return String(+v.toPrecision(n)); };

  // ---- Controls ----
  /* Typing a value into a slider: read a displayed value ("2.2 mF", "4.7 × 10⁵ Pa", "£30,000", "−12 °C") as a number,
     then search the slider's positions for the one whose display matches (copes with log scales and unit prefixes). */
  const PRE = { p: 1e-12, n: 1e-9, "μ": 1e-6, "µ": 1e-6, u: 1e-6, m: 1e-3, k: 1e3, M: 1e6, G: 1e9 }, SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function parseVal(text) {
    const t = String(text).replace(/[−–]/g, "-").replace(/[   ]/g, " ");
    const m = t.match(/-?(?:\d{1,3}(?:[, ]\d{3})+|\d+)(?:\.\d+)?|-?\.\d+/);
    if (!m) return null;
    let v = parseFloat(m[0].replace(/[, ]/g, "")), rest = t.slice(m.index + m[0].length);
    const pw = m[0] === "10" && rest.match(/^(?:\^\s*(-?\d+(?:\.\d+)?)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))/);         // a bare power of ten: 10⁻⁹ or 10^6.5
    if (pw) { v = Math.pow(10, pw[1] != null ? +pw[1] : (pw[2][0] === "⁻" ? -1 : 1) * +[...pw[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join("")); rest = rest.slice(pw[0].length); }
    const ex = rest.match(/^\s*(?:[×x*]\s*10\s*(?:\^\s*(-?\d+)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))|[eE]([-+]?\d+))/);
    if (ex) { const p = ex[1] != null ? +ex[1] : ex[3] != null ? +ex[3] : (ex[2][0] === "⁻" ? -1 : 1) * +[...ex[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join(""); v *= Math.pow(10, p); rest = rest.slice(ex[0].length); }
    const wd = rest.match(/^\s*(thousand|million|billion|trillion)\b/i);    // "1 million K"
    if (wd) { v *= { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 }[wd[1].toLowerCase()]; rest = rest.slice(wd[0].length); }
    const pm = !wd && rest.match(/^\s*([pnμµumkMG])(?=[A-Za-zΩ°])/);
    if (pm) v *= PRE[pm[1]];
    return isFinite(v) ? { v, unit: rest } : null;
  }
  // what was typed, in the units on display unless a unit was typed too ("2.2", "2.2 mF" and "1e-6" all work)
  function typedVal(raw, shown) {
    const q = parseVal(raw); if (!q) return null;
    if (/[A-Za-zμµΩ°%£$€]/.test(q.unit)) return q;
    const s = parseVal(shown); return parseVal(raw + (s ? " " + s.unit.trim() : ""));
  }
  function invertSlider(lo, hi, st, g, target) {
    const n = Math.max(1, Math.round((hi - lo) / st)), pos = i => +(lo + i * st).toFixed(10);
    let e0 = 0, e1 = n;                                                       // ends may show words ("off"): step in to the first numbers
    while (e0 < n && g(pos(e0)) == null && e0 < 60) e0++;
    while (e1 > e0 && g(pos(e1)) == null && n - e1 < 60) e1--;
    const a = g(pos(e0)), b = g(pos(e1));
    if (a == null || b == null || a === b) return null;
    const up = b > a;
    if (up ? target < a : target > a) return pos(e0 > 0 ? 0 : e0);
    if (up ? target > b : target < b) return pos(e1 < n ? n : e1);
    let i0 = e0, i1 = e1, v0 = a, v1 = b;
    while (i1 - i0 > 1) { const im = (i0 + i1) >> 1, vm = g(pos(im)); if (vm == null) break; if ((vm < target) === up) { i0 = im; v0 = vm; } else { i1 = im; v1 = vm; } }
    return Math.abs(v0 - target) <= Math.abs(v1 - target) ? pos(i0) : pos(i1);
  }
  // try every position (cheap here: only the format function runs) and take the closest display; ties go to the one nearest the current setting
  function nearestSlider(lo, hi, st, g, target, cur) {
    const n = Math.max(1, Math.round((hi - lo) / st)); if (n > 20000) return invertSlider(lo, hi, st, g, target);
    let best = null, be = Infinity, bd = Infinity;
    for (let i = 0; i <= n; i++) { const p = +(lo + i * st).toFixed(10), v = g(p); if (v == null) continue; const e = Math.abs(v - target), d = Math.abs(p - cur); if (e < be - 1e-12 * Math.abs(target) || (Math.abs(e - be) <= 1e-12 * Math.abs(target) && d < bd)) { best = p; be = e; bd = d; } }
    return best;
  }
  const scratch = document.createElement("div");

<script>
/* =====================================================================
   NUCLEAR FUSION: GETTING OVER (OR THROUGH) THE BARRIER
   Two nuclei are both positive, so they repel. The closer they get, the
   harder they push apart: this is the COULOMB BARRIER,
       U = k Q₁Q₂ ÷ r  = 1.44 MeV·fm × Z₁Z₂ ÷ r
   Only if they get within about 2–7 fm (1 fm = 10⁻¹⁵ m) does the strong
   force grab them and they fuse, releasing energy (E = Δm c²).
   In a hot gas the nuclei have a spread of energies (mean ³⁄₂kT), almost
   all far below the barrier. Classically they would never fuse. Quantum
   TUNNELLING lets a few through: the chance is about e^(−√(E_G ÷ E)),
   where E_G (the Gamow energy) depends on the charges and masses.
   The best compromise between "enough nuclei at this energy" (falls with
   E as e^(−E/kT)) and "chance to tunnel" (rises with E) is the GAMOW PEAK.
   Higher temperature: more fast nuclei. Higher pressure: more collisions.
   Everything is calculated in MeV, femtometres and SI units.
   ===================================================================== */
const whole = f => v => Math.abs(v - Math.round(v)) < 0.01 ? f(v) : "";

const sup = n => (n < 0 ? "⁻" : "") + String(Math.abs(n)).split("").map(c => SUPD[+c]).join("");
// a number given as its log₁₀, written plainly when it is not too big or small

// S = astrophysical S-factor (MeV·barn), taken as constant; Q = energy released (MeV); same = both nuclei the same kind
const RX = {
  pp: { name: "¹H + ¹H (the Sun)", eq: "¹H + ¹H → ²H + e⁺ + ν", Z: [1, 1], A: [1, 1], S: 4.0e-25, Q: 1.44, same: true, home: "core" },
  pD: { name: "¹H + ²H", eq: "¹H + ²H → ³He + γ", Z: [1, 1], A: [1, 2], S: 2.14e-7, Q: 5.49, home: "core" },
  DD: { name: "²H + ²H (D–D)", eq: "²H + ²H → ³He + n  or  ³H + p", Z: [1, 1], A: [2, 2], S: 0.11, Q: 3.65, same: true, home: "tokamak" },
  DT: { name: "²H + ³H (D–T)", eq: "²H + ³H → ⁴He + n", Z: [1, 1], A: [2, 3], S: 22, Q: 17.59, home: "tokamak" },

  pN: { name: "¹H + ¹⁴N (CNO cycle)", eq: "¹H + ¹⁴N → ¹⁵O + γ  (slowest step of the CNO cycle)", Z: [1, 7], A: [1, 14], S: 3.5e-3, Q: 7.30, home: "core" },
  CC: { name: "¹²C + ¹²C", eq: "¹²C + ¹²C → ²⁰Ne + ⁴He  or  ²³Na + ¹H", Z: [6, 6], A: [12, 12], S: 8.8e16, Q: 13.9, same: true, home: "massive" }

  surface: { name: "the Sun's surface", T: 5800, P: 1e4 },
  core: { name: "the Sun's core", T: 1.57e7, P: 2.5e16 },
  tokamak: { name: "a tokamak (ITER)", T: 1.5e8, P: 5e5 },
  nif: { name: "laser fusion (NIF)", T: 6e7, P: 3.5e16 },
  giant: { name: "a red giant's core", T: 1.2e8, P: 1e21 },

// properties of a reaction: barrier, touching distance, reduced mass, Gamow energy

      { lvl: "std", tag: "4PH1 7(c)", text: "Fusion needs a very high temperature (millions of kelvin) because nuclei are positive and repel: only very fast nuclei get close enough to fuse. A high pressure (density) makes collisions more frequent." },
      { lvl: "std", tag: "4PH1 5(d)", text: "Kelvin temperature is proportional to the mean kinetic energy of the particles: double the kelvin temperature, double the mean KE." },
      { lvl: "std", tag: "4PH1 7(c)", text: "Fusion is hard on Earth: the plasma must be hotter than the Sun's core and must not touch the walls (magnetic confinement in a tokamak, or lasers in NIF)." },
      { lvl: "std", tag: "4PH1 7(c)", text: "Fission splits a heavy nucleus (uranium) after it absorbs a neutron; fusion joins light nuclei. Both release energy; fusion fuel is plentiful and makes far less long-lived waste." },
      { lvl: "adv", tag: "Eduqas nuclear", text: "Energy released = (mass before − mass after) × c²; 1 u = 931.5 MeV. Binding energy per nucleon rises up to iron, so fusing light nuclei releases energy." },
      { lvl: "adv", tag: "Eduqas fields", text: "Coulomb barrier U = kQ₁Q₂/r = 1.44 MeV fm × Z₁Z₂/r. Nuclei touch at r ≈ 1.2(A₁^⅓ + A₂^⅓) fm." },
      { lvl: "adv", tag: "Eduqas thermal", text: "Mean KE of a particle = ³⁄₂kT. In the Sun's core kT ≈ 1.35 keV, far below the 600 keV barrier." },
      { lvl: "adv", tag: "beyond spec", text: "Tunnelling chance ≈ e^(−√(E_G/E)); Boltzmann factor e^(−E/kT); their product peaks at the Gamow peak E₀ = (E_G(kT)²/4)^⅓." }
    ],
    questions: [
      { lvl: "std", marks: 2, q: "Explain why fusion only happens at very high temperatures.", ans: "<ul><li>nuclei are positively charged so they repel</li><li>only at very high temperature do they move fast enough (have enough kinetic energy) to get close enough to fuse</li></ul>" },
      { lvl: "std", marks: 2, q: () => `The temperature of a gas rises from ${K.sig(Math.pow(10, P.lT) / 2, 3)} K to ${K.sig(Math.pow(10, P.lT), 3)} K. What happens to the mean kinetic energy of its particles?`, ans: "<ul><li>the kelvin temperature doubles</li><li>so the mean kinetic energy doubles</li></ul>" },
      { lvl: "std", marks: 2, q: "Complete the equation: ²₁H + ³₁H → ⁴₂He + ?", ans: "<ul><li>¹₀n (a neutron)</li><li>mass numbers 2 + 3 = 4 + 1; atomic numbers 1 + 1 = 2 + 0</li></ul>" },
      { lvl: "std", marks: 3, q: "Give two reasons why it is difficult to build a fusion power station.", ans: "<ul><li>needs temperatures over 100 million K</li><li>the hot plasma must be kept away from the walls (strong magnetic fields)</li><li>so far it takes more energy to run than it produces (any two)</li></ul>" },
      { lvl: "adv", marks: 3, q: () => { const q = rx(P.rx); return `For ${q.name}, calculate the Coulomb barrier at the touching distance r = ${q.R.toFixed(2)} fm, in MeV and in J.`; }, ans: () => { const q = rx(P.rx); return `<ul><li>U = 1.44 MeV fm × ${q.Z[0]} × ${q.Z[1]} ÷ ${q.R.toFixed(2)} fm</li><li>= ${q.Ub.toFixed(3)} MeV</li><li>= ${(q.Ub * MEV).toExponential(2)} J</li></ul>`; } },
      { lvl: "adv", marks: 2, q: () => `Calculate the mean kinetic energy of a nucleus at ${sci(Math.pow(10, P.lT), 3)} K, in J and in keV.`, ans: () => { const E = 1.5 * 1.381e-23 * Math.pow(10, P.lT); return `<ul><li>³⁄₂kT = 1.5 × 1.38 × 10⁻²³ × ${sci(Math.pow(10, P.lT), 3)}</li><li>= ${E.toExponential(2)} J = ${K.sig(E / MEV * 1000, 3)} keV</li></ul>`; } },
      { lvl: "adv", marks: 3, q: "Explain why the Sun can fuse hydrogen although ³⁄₂kT in its core is hundreds of times smaller than the Coulomb barrier.", ans: "<ul><li>a few nuclei have energies far above the mean (the Maxwell–Boltzmann tail)</li><li>quantum tunnelling lets some pass through the barrier without enough energy to go over it</li><li>there are so many collisions that even a tiny chance gives a large total rate</li></ul>" }
    ]
  },
  notes: `<h3>The model</h3>
<ul><li><b>Barrier</b>: U = 1.44 MeV·fm × Z₁Z₂/r outside the touching distance R = 1.2 fm × (A₁^⅓ + A₂^⅓). Inside R, a strong-force well, drawn schematically (shallower than the real 30–50 MeV).</li>
<li><b>Collisions</b>: colliding pairs have energies spread as E e^(−E/kT) (faster pairs collide more often).</li>
<li><b>Tunnelling</b>: the chance of getting through is the Gamow factor e^(−√(E_G/E)) with E_G = 2μc²(παZ₁Z₂)²; it is 1 above the barrier. Without tunnelling, only nuclei with E above the barrier fuse.</li>
<li><b>Rates</b>: ⟨σv⟩ = √(8/πμ) (kT)^(−3/2) S ∫ e^(−E/kT − √(E_G/E)) dE with a constant S-factor for each reaction. Reactions per m³ per s = n₁n₂⟨σv⟩ (n²⟨σv⟩/2 for identical nuclei); n = P ÷ ((1 + Z)kT) for a fully ionised 50 : 50 mix.</li>
<li><b>Demonstration odds</b>: real chances are tiny, so each reaction has a fixed boost (a 1-2-5 number) chosen so that about 1 collision in 10 fuses at its usual place. The boost does not change with temperature or pressure, so comparisons stay fair; "true odds" removes it.</li></ul>
<h3>Checks (the Sun's core, 15.7 million K)</h3>
<ul><li>Barrier for ¹H + ¹H: 600 keV (accepted about 550–600 keV). kT = 1.35 keV. Gamow peak 6.1 keV (accepted about 6 keV).</li>
<li>⟨σv⟩ for ¹H + ¹H about 10⁻⁴⁹ m³/s; rate ∝ T⁴ (CNO about T¹⁶–T¹⁸), as accepted.</li></ul>
<h3>Left out</h3>
<ul><li>Electron screening, energy-dependent S-factors (D–T has a resonance near 64 keV), real stellar mixtures, radiation pressure, degenerate electrons, and the 3D geometry of collisions (the diagram is one line through the target nucleus).</li></ul>
<p>The earlier version of this simulation, with its worksheets, is kept in <a href="original/nuclear-fusion.html">original/nuclear-fusion.html</a>.</p>`
});

// ---------------- Controls ----------------
const ctl = {};
let g = ui.group("Reaction and place");
ctl.rx = K.seg(g, { label: "Reaction", value: "pp", options: Object.keys(RX).map(k => [k, RX[k].name]), on: v => set({ rx: v, place: P.place, lT: P.lT, lP: P.lP, tun: P.tun, mode: P.mode }) });
ctl.place = K.seg(g, { label: "Place", value: "core", options: Object.keys(PLACES).map(k => [k, PLACES[k].name]), on: v => set({ rx: P.rx, place: v, tun: P.tun, mode: P.mode }) });
ctl.lT = K.slider(g, { label: "Temperature", min: 2.4, max: 10, step: 0.01, value: P.lT, fmt: v => sciL(v, 3) + " K", on: v => { P.lT = v; fresh(); } });
ctl.lP = K.slider(g, { label: "Pressure", min: 0, max: 24, step: 0.05, value: P.lP, fmt: v => sciL(v, 2) + " Pa", on: v => { P.lP = v; fresh(); } });
ctl.tun = K.toggle(g, { label: "Quantum tunnelling", value: true, on: v => { P.tun = v; fresh(); } });
g = ui.group("Collisions");
ctl.mode = K.seg(g, { value: "demo", options: [["demo", "Demonstration odds"], ["true", "True odds"]], on: v => { P.mode = v; fresh(); } });
let rr = K.row(g); K.btn(rr, "⏩ Skip to the next fusion", () => skip(), "primary"); K.btn(rr, "📌 Record this run", () => record()); K.btn(rr, "Clear", () => { records = []; });
ctl.zoom = K.toggle(g, { label: "Zoom the energy axis on the incoming nuclei", value: false, on: v => P.zoom = v });
ctl.speed = K.slider(g, { label: "Collisions shown", min: 0.5, max: 20, step: 0.5, value: 1, fmt: v => v + " per second", on: v => speed = v });
ui.headerSpeed(ctl.speed);   // playback speed lives in the header, beside Pause and Reset
const read = K.readout(ui.group("Readings"), [["kt", "kT · mean KE (³⁄₂kT)"], ["ub", "barrier height"], ["ch", "chance per collision"], ["e0", "Gamow peak E₀"], ["pw", "power released"]]);

function fresh() { cnt = { sent: 0, thru: 0 }; anim = null; lastSkip = ""; }
function set(o) {
  Object.assign(P, { tun: true, mode: "demo" }, o);
  if (o.place) { P.lT = Math.log10(PLACES[o.place].T); P.lP = Math.log10(PLACES[o.place].P); }
  Q = rx(P.rx); boost = boostFor(Q);
  ctl.rx.set(P.rx); ctl.place.set(P.place); ctl.lT.set(P.lT); ctl.lP.set(P.lP); ctl.tun.set(P.tun); ctl.mode.set(P.mode);
  fresh();
}
const T = () => Math.pow(10, P.lT), kTnow = () => KB * T();
const odds = E => { const p = P.tun ? tunnel(Q, E) : (E >= Q.Ub ? 1 : 0); return P.mode === "demo" ? Math.min(1, p * boost) : p; };
function launch() { const E = drawE(kTnow(), rnd); const fuse = rnd() < odds(E); cnt.sent++; if (fuse) cnt.thru++; anim = { E, fuse, t: 0 }; }
// skip ahead at the true odds: how many collisions bounce back before one gets through (a geometric distribution)
function skip() {
  const lp = logChance(Q, T(), P.tun); if (lp < -300) { lastSkip = `The chance is about 10${sup(Math.round(lp))} per collision: you would wait for ever.`; return; }
  const p = Math.pow(10, lp), n = p > 0.5 ? 0 : Math.floor(Math.log(1 - rnd()) / Math.log1p(-p));
  lastSkip = `${n.toLocaleString()} collisions bounced back before one fused (true odds).`; P.mode = "true"; ctl.mode.set("true"); cnt.sent += n + 1; cnt.thru += 1;
  let E; do { E = drawE(kTnow(), rnd); } while (rnd() > tunnel(Q, E) && E < Q.Ub * 50); anim = { E, fuse: true, t: 0 };
}
function record() { const lp = logChance(Q, T(), P.tun), b = P.mode === "demo" ? boost : 1; records.push({ txt: `${Q.name}, ${sciL(P.lT, 2)} K${P.tun ? "" : ", no tunnelling"}: ${cnt.thru}/${cnt.sent} with boost ×${sci(b, 1)} → estimate ${cnt.sent ? sci(cnt.thru / cnt.sent / b * 1e6, 2) : "–"} per million (model ${sciL(lp + 6, 2)})` }); if (records.length > 6) records.shift(); }

// ---------------- Drawing ----------------
const cv = ui.canvas(() => { });
const chA = K.chart(ui.dock, {}), chB = K.chart(ui.dock, {});
const TX = (c, s, x, y, col = "#aab6cc", al = "left", f = "12px") => { c.fillStyle = col; c.font = f + " Segoe UI,sans-serif"; c.textAlign = al; c.fillText(s, x, y); };
const LR0 = Math.log10(0.5), LR1 = 5;                                        // the distance axis: 0.5 fm to 10⁵ fm (log scale)
function draw() {
  const c = cv.ctx, w = cv.w, h = cv.h; c.fillStyle = "#0b1020"; c.fillRect(0, 0, w, h);
  const x0 = 70, x1 = w - 30, yb = h - 70, yt = 120, kT = kTnow(), W = 0.5 * Q.Ub;
  const Emax = P.zoom ? Math.max(8 * kT, 3 * gamowE0(Q, kT)) : 1.25 * Q.Ub, Emin = P.zoom ? 0 : -W * 1.2;
  const X = r => x0 + (Math.log10(Math.max(r, 0.5)) - LR0) / (LR1 - LR0) * (x1 - x0), Y = E => yb - (E - Emin) / (Emax - Emin) * (yb - yt);
  // axes
  c.strokeStyle = "#3a4560"; c.beginPath(); c.moveTo(x0, yt - 10); c.lineTo(x0, yb); c.lineTo(x1, yb); c.stroke();
  for (let e = 0; e <= 5; e++) { const x = X(Math.pow(10, e)); c.fillStyle = "#3a4560"; c.fillRect(x, yb, 1, 5); TX(c, "10" + sup(e) + " fm", x, yb + 18, "#7d8aa5", "center", "11px"); }
  TX(c, "distance between the nuclei (log scale)", (x0 + x1) / 2, yb + 36, "#aab6cc", "center", "12px");
  c.save(); c.translate(18, (yt + yb) / 2); c.rotate(-Math.PI / 2); TX(c, "energy (MeV)", 0, 0, "#aab6cc", "center", "12px"); c.restore();
  if (Emin < 0) { c.strokeStyle = "#3a4560"; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(x0, Y(0)); c.lineTo(x1, Y(0)); c.stroke(); c.setLineDash([]); }
  // the potential: Coulomb barrier outside R, strong-force well inside
  c.save(); c.beginPath(); c.rect(x0, yt - 20, x1 - x0, yb - yt + 20); c.clip();
  c.strokeStyle = "#ff8a70"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(0.5), Y(-W)); c.lineTo(X(Q.R), Y(-W)); c.lineTo(X(Q.R), Y(Q.Ub));
  for (let i = 0; i <= 200; i++) { const r = Q.R * Math.pow(1e5 / Q.R, i / 200); c.lineTo(X(r), Y(1.44 * Q.Z[0] * Q.Z[1] / r)); } c.stroke();
  c.fillStyle = "rgba(127,227,160,0.12)"; c.fillRect(X(0.5), Y(Math.min(0, Emax)), X(Q.R) - X(0.5), Y(-W) - Y(Math.min(0, Emax)));
  // energy levels: kT, mean KE, Gamow peak
  for (const [E, lab, col] of [[kT, "kT", "#6fb1ff"], [1.5 * kT, "³⁄₂kT", "#6fb1ff"], [gamowE0(Q, kT), "Gamow peak", "#7fe3a0"]]) { if (E > Emax) continue; c.strokeStyle = col; c.globalAlpha = 0.5; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(x0, Y(E)); c.lineTo(x1, Y(E)); c.stroke(); c.setLineDash([]); c.globalAlpha = 1; TX(c, lab, x1 - 4, Y(E) - 4, col, "right", "11px"); }
  // the incoming nucleus
  if (anim) {
    const E = anim.E, rt = 1.44 * Q.Z[0] * Q.Z[1] / E, rtc = Math.min(rt, 1e5), over = E >= Q.Ub, tt = anim.t;
    const lr = t => Math.log10(1e5) + (Math.log10(over ? Q.R : rtc) - 5) * t;
    let r, y = Y(Math.min(E, Emax * 0.98)), fx = null;
    if (tt < 1) r = Math.pow(10, lr(tt));
    else if (!anim.fuse) r = Math.pow(10, lr(2 - Math.min(2, tt)));
    else { const u = Math.min(1, (tt - 1) / 0.6); r = (over ? Q.R : rtc) * Math.pow((0.6) / (over ? Q.R : rtc), u); if (tt > 1 && !over) { c.strokeStyle = "#ffd166"; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(rtc), y); c.lineTo(X(Q.R), y); c.stroke(); c.setLineDash([]); TX(c, "tunnels through", (X(rtc) + X(Q.R)) / 2, y - 8, "#ffd166", "center", "11px"); } if (u >= 1) fx = 1; if (r < Q.R) y = Y(-W * 0.6); }
    c.fillStyle = anim.fuse && tt > 1 ? "#ffd166" : "#6fb1ff"; c.beginPath(); c.arc(X(r), y, 7, 0, 6.3); c.fill();
    if (rt > 1e5 && tt < 1.2) TX(c, "turns back off the right-hand edge (too slow to get even this close)", x1, y - 12, "#7d8aa5", "right", "11px");
    if (fx) { c.fillStyle = "rgba(255,209,102,0.25)"; c.beginPath(); c.arc(X(0.6), Y(-W * 0.6), 30, 0, 6.3); c.fill(); }
  }
  c.restore();
  c.fillStyle = "#ff8a70"; c.beginPath(); c.arc(X(0.5), Y(Math.max(Emin, -W * 0.6)), 9, 0, 6.3); c.fill(); TX(c, "target", X(0.5), Y(Math.max(Emin, -W * 0.6)) + 22, "#ff8a70", "center", "11px");
  if (!P.zoom || Q.Ub <= Emax) TX(c, `barrier ${K.sig(Q.Ub * 1000, 3)} keV at ${Q.R.toFixed(1)} fm`, X(Q.R) + 8, Y(Math.min(Q.Ub, Emax)) + 4, "#ff8a70", "left", "600 12px");
  else TX(c, `↑ barrier peak ${K.sig(Q.Ub * 1000, 3)} keV, far off the top`, X(Q.R) + 8, yt + 4, "#ff8a70", "left", "600 12px");
  if (!P.zoom) TX(c, "strong-force well (drawn shallower than the real 30–50 MeV)", X(0.5) + 4, Y(-W) + 16, "#7fe3a0", "left", "11px");
  // headline text
  TX(c, Q.eq + `   (${K.sig(Q.Q, 3)} MeV released)`, 20, 26, "#eef2f8", "left", "600 14px");
  TX(c, `${PLACES[P.place] && Math.abs(P.lT - Math.log10(PLACES[P.place].T)) < 0.005 ? PLACES[P.place].name + ": " : ""}${sciL(P.lT, 3)} K, ${sciL(P.lP, 2)} Pa${P.tun ? "" : " · tunnelling OFF"}`, 20, 46, "#aab6cc", "left", "12.5px");
  const b = P.mode === "demo" ? boost : 1, lp = logChance(Q, T(), P.tun);
  TX(c, `collisions: ${cnt.sent.toLocaleString()} · fused: ${cnt.thru.toLocaleString()}` + (P.mode === "demo" ? `   ·   demonstration odds: real chance × ${sci(boost, 1)}${Math.pow(10, lp) * boost > 1 ? " (capped at 100%)" : ""}` : "   ·   true odds"), 20, 68, "#ffd166", "left", "12.5px");
  TX(c, `real chance: ${sciL(lp + 6, 2)} per million collisions · your estimate: ${cnt.sent ? sci(cnt.thru / cnt.sent / b * 1e6, 2) : "–"} per million`, 20, 88, "#aab6cc", "left", "12px");
  if (lastSkip) TX(c, lastSkip, 20, 106, "#7fe3a0", "left", "12px");
  records.forEach((q, i) => TX(c, "📌 " + q.txt, 20, h - 50 + (i - records.length + 1) * 15 - 0, "#7d8aa5", "left", "11px"));
}

// ---------------- Charts and readouts ----------------
function charts() {
  const kT = kTnow(), E0 = gamowE0(Q, kT), xm = Math.max(4 * E0, 10 * kT) * 1000, bz = [], tu = [], pr = []; let pm = 0;
  for (let i = 1; i <= 160; i++) { const E = xm / 1000 * i / 160, b = Math.exp(-E / kT), t = P.tun ? tunnel(Q, E) : (E >= Q.Ub ? 1 : 0); bz.push([E * 1000, b]); tu.push([E * 1000, t]); pr.push([E * 1000, b * t]); pm = Math.max(pm, b * t); }
  const tm = Math.max(...tu.map(p => p[1])) || 1;
  chA.opts.title = "Gamow peak"; chA.opts.xLabel = "collision energy (keV)"; chA.opts.yLabel = "relative"; chA.opts.xFmt = null;
  chA.draw([{ pts: bz, color: "#6fb1ff", label: "how many: e^(−E/kT)" }, { pts: tu.map(p => [p[0], p[1] / tm]), color: "#ff8a70", label: "chance to get through" }, { pts: pr.map(p => [p[0], pm ? p[1] / pm : 0]), type: "area", color: "#7fe3a0", label: "product" }], { xMin: 0, xMax: xm, yMin: 0, yMax: 1.05, vlines: E0 * 1000 < xm ? [{ x: E0 * 1000, color: "#7fe3a0", label: "E₀" }] : [] });
  const ser = []; for (const [k, col] of [["pp", "#6fb1ff"], ["DT", "#ffd166"], ["pN", "#ff8a70"], ["CC", "#c9a0ff"]]) { const q = rx(k), pts = []; for (let lt = 6; lt <= 9.5; lt += 0.05) { const v = logSigV(q, Math.pow(10, lt)); if (v > -60) pts.push([lt, v]); } ser.push({ pts, color: col, width: k === P.rx ? 3 : 1.4, label: RX[k].name.split(" (")[0] }); }
  if (!["pp", "DT", "pN", "CC"].includes(P.rx)) { const pts = []; for (let lt = 6; lt <= 9.5; lt += 0.05) { const v = logSigV(Q, Math.pow(10, lt)); if (v > -60) pts.push([lt, v]); } ser.push({ pts, color: "#7fe3a0", width: 3, label: Q.name }); }
  chB.opts.title = "⟨σv⟩ against T"; chB.opts.xLabel = "temperature (K)"; chB.opts.yLabel = "⟨σv⟩ (m³/s)"; chB.opts.xFmt = whole(v => "10" + sup(Math.round(v)));
  chB.draw(ser, { xMin: 6, xMax: 9.5, yMin: -60, yMax: -18, yFmt: v => "10" + sup(Math.round(v)), vlines: [{ x: P.lT, color: "#eef2f8", label: "now" }] });
  const G = gas(Q, T(), Math.pow(10, P.lP)), lp = logChance(Q, T(), P.tun), lpc = logChance(Q, T(), false);
  read.set("kt", `${K.sig(kT * 1000, 3)} keV · ${K.sig(1.5 * kT * 1000, 3)} keV`); read.set("ub", `${K.sig(Q.Ub * 1000, 3)} keV (${sci(Q.Ub / kT, 2)} × kT)`);
  read.set("ch", P.tun ? `${sciL(lp, 2)} (no tunnelling: ${sciL(lpc, 2)})` : sciL(lpc, 2)); read.set("e0", ui.level === "adv" ? `${K.sig(E0 * 1000, 3)} keV · E_G = ${K.sig(Q.EG * 1000, 4)} keV` : `${K.sig(E0 * 1000, 3)} keV`);
  read.set("pw", P.tun ? `${sciL(G.lPow, 2)} W/m³ · each nucleus waits ${sciL(G.lWait - 7.499, 2)} years` : "none (no tunnelling)");
  ui.hud(lp < -100 ? "Practically no collision gets through: too cold for this reaction" : lp < -12 ? "Very rare, but with so many nuclei it adds up" : "Fusion is happening: hot enough for this reaction");
}

// ---------------- The loop ----------------
let frame = 0;
ui.run(dt => {
  if (!(dt > 0)) return;
  if (!anim) launch(); else { anim.t += dt * 1.6 * Math.max(1, speed / 2); if (anim.t > (anim.fuse ? 2.1 : 2)) launch(); }
  if (speed > 2) for (let k = 0; k < Math.round((speed - 2) * dt); k++) { const E = drawE(kTnow(), rnd); cnt.sent++; if (rnd() < odds(E)) cnt.thru++; }
}, () => { draw(); if (frame++ % 6 === 0) charts(); });
set({ rx: "pp", place: "core" });
ui.tip("Nuclei arrive from the right with energies set by the temperature. Most bounce off the barrier; a few tunnel through and fuse.", 7000);
</script>
</body></html>
