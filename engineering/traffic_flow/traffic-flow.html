<!doctype html>
<!-- Traffic Flow and Phantom Jams: one self-contained file, works offline. Built from tools/kit (kit.css, kit.js, src/traffic_flow.js); edit those and run "node build.js". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic Flow and Phantom Jams</title>
<style>
/* ===== Enhanced (kit-built) simulations: shared look and feel (inlined into every page by build.js) ===== */
:root{
  --bg:#0a0f1c; --panel:#111a2c; --panel2:#17223a; --line:#24324f; --text:#e9eef8; --muted:#8fa0bf; --grid:#1f2c47;
  --accent:#5ad1ff; --accent-ink:#04121c; --good:#6ee7a0; --warn:#ffb454; --bad:#ff6b81;
  --s0:#5ad1ff; --s1:#ffb454; --s2:#7ee787; --s3:#ff7b9c; --s4:#c4a1ff; --s5:#ffe66d;
  --shadow:0 10px 30px rgba(0,0,0,.45); --r:12px;
}
:root[data-theme=light]{
  --bg:#eef2f8; --panel:#ffffff; --panel2:#f3f6fb; --line:#d5dceb; --text:#172033; --muted:#5d6b85; --grid:#e3e8f2;
  --accent:#0b7fc2; --accent-ink:#ffffff; --good:#12924c; --warn:#b86a00; --bad:#d1344d;
  --s0:#0b7fc2; --s1:#d97a00; --s2:#1b9e4b; --s3:#d6336c; --s4:#7048c8; --s5:#a08800;
  --shadow:0 8px 24px rgba(30,50,90,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.k-top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-height:52px}
.k-home{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}.k-home:hover{color:var(--accent)}
.k-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.k-title h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.k-chip{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 9px;white-space:nowrap;align-self:center}
.k-blurb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-actions{display:flex;gap:6px;flex:none}
.k-btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:.12s;user-select:none}
.k-btn:hover{border-color:var(--accent);color:var(--accent)}
.k-btn:active{transform:translateY(1px)}
.k-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.k-btn.primary:hover{filter:brightness(1.1);color:var(--accent-ink)}
.k-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.k-btn.small{padding:3px 9px;font-size:12.5px}
.k-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.k-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.k-left{display:flex;flex-direction:column;min-width:0;min-height:0}
.k-stage{flex:1;position:relative;min-height:0;background:#060a14;overflow:hidden}
.k-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.k-dock{flex:none;height:190px;display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.k-dock:empty{display:none}
.k-dock>*{flex:1;min-width:0;background:var(--panel)}
.k-chart{position:relative;height:100%;min-height:80px}
.k-chart canvas{position:absolute;inset:0;width:100%;height:100%}
.k-side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.k-tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.k-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--muted);font-weight:600}
.k-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.k-pane{flex:1;overflow-y:auto;padding:12px 14px 20px;display:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.k-pane.on{display:block}
.k-group{margin-bottom:14px}
.k-group>h3{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:0 0 8px;font-weight:700}
.k-ctl{margin-bottom:10px}
.k-ctl label{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:2px}
.k-ctl label b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.k-ctl small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6.5px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.k-seg{display:flex;flex-wrap:wrap;gap:4px}
.k-seg .k-btn{flex:1 1 auto;padding:5px 8px;font-size:13px;text-align:center}
.k-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.k-row .k-btn{flex:1 1 auto;text-align:center}
.k-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;margin-bottom:9px;font-size:13px;user-select:none}
.k-toggle i{flex:none;width:34px;height:19px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.k-toggle i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.15s}
.k-toggle.on i{background:var(--accent)}.k-toggle.on i::after{left:17px;background:var(--accent-ink)}
.k-read{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.k-read div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.k-read span{display:block;font-size:11px;color:var(--muted)}
.k-read b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:650}
.k-mcard{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:11px 12px;margin-bottom:10px}
.k-mcard h4{margin:0 0 4px;font-size:14.5px;display:flex;gap:8px;align-items:center}
.k-mcard h4 em{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.k-mcard.done h4 em{background:var(--good);color:#04130a}
.k-mcard p{margin:0 0 8px;color:var(--muted);font-size:13px}
.k-banner{position:absolute;left:12px;top:12px;max-width:min(520px,70%);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--accent);border-radius:var(--r);padding:10px 34px 10px 13px;box-shadow:var(--shadow);z-index:5;backdrop-filter:blur(6px);font-size:13.5px}
.k-banner b{color:var(--accent)}
.k-banner .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--muted);background:none;border:0;font-size:16px}
.k-banner details{margin-top:6px;color:var(--muted)}.k-banner summary{cursor:pointer;color:var(--warn)}
.k-tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(8,14,26,.82);color:#dfe8f7;border:1px solid #2b3a5c;border-radius:99px;padding:6px 16px;font-size:13px;pointer-events:none;z-index:4;transition:opacity .6s;white-space:nowrap}
.k-hud{position:absolute;right:12px;top:12px;background:rgba(8,14,26,.72);color:#dfe8f7;border:1px solid #2b3a5c;border-radius:10px;padding:7px 11px;font-size:12.5px;z-index:3;pointer-events:none;font-variant-numeric:tabular-nums;line-height:1.5;text-align:right}
.k-notes h3{font-size:14px;margin:14px 0 4px;color:var(--accent)}.k-notes h3:first-child{margin-top:0}
.k-notes p,.k-notes li{font-size:13px;color:var(--text)}.k-notes ul{padding-left:18px;margin:4px 0}
.k-notes code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12.5px}
.k-overlay{position:fixed;inset:0;background:rgba(3,6,12,.7);display:none;z-index:50;backdrop-filter:blur(3px)}
.k-overlay.on{display:grid;place-items:center}
.k-modal{width:min(1180px,95vw);height:min(700px,92vh);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.k-blist{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.k-blist h2{font-size:16px;margin:0 0 4px}.k-blist>p{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.k-bitem{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.k-bitem.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.k-bitem b{display:block;font-size:13.5px}.k-bitem span{color:var(--muted);font-size:12.5px}
.k-bmain{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 16px}
.k-bhead{display:flex;gap:10px;align-items:flex-start}
.k-bhead h3{margin:0;font-size:17px;flex:1}.k-bhead p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:400}
.k-bbar{display:flex;gap:10px;align-items:center;margin:10px 0 8px}
.k-prog{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.k-prog i{display:block;height:100%;width:0;background:var(--accent)}
.k-bchart{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.k-bfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;height:150px;margin-top:10px}
.k-btable{overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.k-btable table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.k-btable th,.k-btable td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
.k-btable th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600}
.k-bnote{overflow:auto;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px}
.k-bnote b{color:var(--text)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
.k-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap;background:#35505a;color:#c9ecdf}
.k-tag.adv{background:#4b3a78;color:#e3d6ff}.k-tag.beyond{background:#39465c;color:#cfdaf0}
.k-idea{font-size:13px;margin:0 0 8px;line-height:1.4}.k-spec{font-size:12px;color:var(--muted);margin:0 0 10px}
.k-pane>h3{font-size:14px;margin:14px 0 8px;color:var(--accent)}
.k-q h4{font-size:12px}.k-q .k-marks{margin-left:auto;color:var(--muted);font-weight:400}.k-q p{color:var(--text);font-size:13.5px}
.k-q details{font-size:13px;color:var(--muted)}.k-q summary{cursor:pointer;color:var(--warn)}.k-q details ul{padding-left:18px;margin:4px 0}
.k-level{padding-bottom:4px}
.k-tabs button{font-size:13px;padding-left:2px;padding-right:2px}
</style></head><body>
<script>
"use strict";
/* =====================================================================
   K: the small shared toolkit behind the ★ enhanced simulations.
   It builds the page frame (header, stage, chart dock, side panel),
   the sliders and buttons, the live charts, the Investigations cards
   and the Batch run window. Each simulation's own code (below this
   script in the page) holds the science.
   ===================================================================== */
const K = (() => {
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => cssVar("--s" + (i % 6));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Repeatable random numbers: the same seed always gives the same run ----
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * r()); };
    r.int = n => Math.floor(r() * n);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    return r;
  }
  // ---- Simple statistics ----
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length || 1);
  function linfit(pts) { // least-squares straight line through [x,y] points
    const n = pts.length, mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1]));
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    const m = sxy / (sxx || 1); return { m, c: my - m * mx, r: sxy / Math.sqrt((sxx * syy) || 1), n };
  }
  function download(name, text) { const a = $("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const sig = (v, n = 3) => { if (v == null || !isFinite(v)) return "–"; if (v === 0) return "0"; const a = Math.abs(v); if (a >= 1e5 || a < 1e-3) return v.toExponential(n - 1); return String(+v.toPrecision(n)); };

  // ---- Controls ----
  function slider(parent, o) {
    const w = $("div", "k-ctl"), lab = $("label"), name = $("span", "", o.label), val = $("b"), inp = $("input");
    inp.type = "range"; inp.min = o.min; inp.max = o.max; inp.step = o.step || 1; inp.value = o.value;
    const fmt = o.fmt || (v => sig(v, 4) + (o.unit ? " " + o.unit : ""));
    const show = () => val.innerHTML = fmt(+inp.value);
    lab.append(name, val); w.append(lab, inp); if (o.tip) w.append($("small", "", o.tip)); parent.append(w); show();
    inp.addEventListener("input", () => { show(); o.on && o.on(+inp.value); });
    return { el: w, get value() { return +inp.value; }, set(v, fire) { inp.value = v; show(); if (fire) o.on && o.on(+inp.value); } };
  }
  function seg(parent, o) {
    const w = $("div", "k-ctl"); if (o.label) w.append($("label", "", `<span>${o.label}</span>`));
    const row = $("div", "k-seg"); w.append(row); if (o.tip) w.append($("small", "", o.tip)); parent.append(w);
    let value = o.value; const btns = [];
    const paint = () => btns.forEach(([v, b]) => b.classList.toggle("on", v === value));
    for (const [v, label, title] of o.options) { const b = $("button", "k-btn", label); if (title) b.title = title; b.onclick = () => { value = v; paint(); o.on && o.on(v); }; row.append(b); btns.push([v, b]); }
    paint();
    return { el: w, get value() { return value; }, set(v, fire) { value = v; paint(); if (fire) o.on && o.on(v); } };
  }
  function toggle(parent, o) {
    const w = $("div", "k-toggle" + (o.value ? " on" : ""), `<i></i><span>${o.label}</span>`); parent.append(w); let value = !!o.value;
    w.onclick = () => { value = !value; w.classList.toggle("on", value); o.on && o.on(value); };
    return { el: w, get value() { return value; }, set(v, fire) { value = !!v; w.classList.toggle("on", value); if (fire) o.on && o.on(value); } };
  }
  function btn(parent, label, on, cls) { const b = $("button", "k-btn " + (cls || ""), label); b.onclick = on; parent.append(b); return b; }
  function row(parent) { const r = $("div", "k-row"); parent.append(r); return r; }
  function readout(parent, items) { // small tiles of live numbers
    const g = $("div", "k-read"), map = {}; parent.append(g);
    for (const [id, label] of items) { const d = $("div", "", `<span>${label}</span><b>–</b>`); g.append(d); map[id] = d.lastChild; }
    return { el: g, set(id, v) { if (map[id].textContent !== String(v)) map[id].innerHTML = v; } };
  }
  function note(parent, html) { const s = $("small", "", html); s.style.cssText = "display:block;color:var(--muted);margin:-2px 0 10px;font-size:12px;line-height:1.35"; parent.append(s); return s; }

  // ---- A canvas that stays sharp on high-DPI screens and follows its container's size ----
  function canvas(parent, onresize) {
    const cv = $("canvas"); parent.append(cv); const c = { el: cv, ctx: cv.getContext("2d"), w: 1, h: 1, dpr: 1 };
    const fit = () => {
      const w = parent.clientWidth, h = parent.clientHeight; if (!w || !h) return;
      c.dpr = Math.min(window.devicePixelRatio || 1, 2); c.w = w; c.h = h; cv.width = Math.round(w * c.dpr); cv.height = Math.round(h * c.dpr);
      c.ctx.setTransform(c.dpr, 0, 0, c.dpr, 0, 0); onresize && onresize(c);
    };
    new ResizeObserver(fit).observe(parent); fit(); return c;
  }
  // Pointer handling in the element's own pixel coordinates
  function pointer(el, h) {
    const pos = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, e }; };
    let down = false;
    el.addEventListener("pointerdown", e => { down = true; el.setPointerCapture(e.pointerId); h.down && h.down(pos(e)); });
    el.addEventListener("pointermove", e => { const p = pos(e); if (down) h.drag && h.drag(p); else h.hover && h.hover(p); });
    const up = e => { if (down) { down = false; h.up && h.up(pos(e)); } };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", e => h.leave && h.leave(pos(e)));
    el.addEventListener("contextmenu", e => e.preventDefault());
  }

  // ---- Charts ----
  const charts = new Set();
  function niceTicks(a, b, n) {
    const span = (b - a) || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    const step = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p, t = [];
    for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + step * 1e-6; v += step) t.push(Math.abs(v) < step * 1e-9 ? 0 : v);
    return { t, step };
  }
  const tickFmt = (v, step) => { const a = Math.abs(v); if (a >= 1e5 || (a > 0 && a < 1e-3)) return v.toExponential(0); return v.toFixed(clamp(-Math.floor(Math.log10(step) + 1e-9), 0, 4)); };
  /* chart(parent,{title,xLabel,yLabel,xMin,xMax,yMin,yMax,yZero})  then  .draw(series, extra)
     series: [{pts:[[x,y(,err)]...], type:"line"|"dots"|"bars"|"area"|"err", color, label, dash, width, r}]
     extra:  {xMin..yMax overrides, vlines:[{x,color,label,dash}], hlines:[{y,...}], bands:[{x0,x1,color}]} */
  function chart(parent, o = {}) {
    const wrap = $("div", "k-chart"), cv = $("canvas"); wrap.append(cv); parent.append(wrap);
    const ctx = cv.getContext("2d"); let last = [[], {}];
    const api = { el: wrap, opts: o, draw(series, extra) { last = [series || [], extra || {}]; render(); }, redraw: () => render(), map: null };
    function render() {
      const W = wrap.clientWidth, H = wrap.clientHeight; if (W < 40 || H < 40) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const [series, ex] = last, q = Object.assign({}, o, ex);
      const text = cssVar("--text"), muted = cssVar("--muted"), grid = cssVar("--grid");

<script>
/* =====================================================================
   TRAFFIC FLOW AND PHANTOM JAMS
   Why does motorway traffic grind to a halt for no reason, then clear
   again with no accident or roadworks in sight?

   Each vehicle here follows one rule, the "Intelligent Driver Model"
   (Treiber, Hennecke and Helbing, 2000). A driver wants to:
     * speed up towards the speed they would like to go, and
     * keep a safe gap to the vehicle in front: a minimum gap, plus a
       time gap (so many seconds behind), plus extra if closing fast.

       acceleration = a × [ 1 − (v / v_want)⁴ − (gap_wanted / gap)² ]

   Add small human imperfections (a moment's inattention) and, above a
   certain density, a tiny slow-down grows as it passes from driver to
   driver until someone stops. The jam that results travels BACKWARDS
   along the road at 10 to 20 km/h while the cars go forwards through it.
   Nobody caused it and no single driver can see it: it is a wave.

   UNITS: metres, seconds, m/s (shown as km/h and mph).
   ===================================================================== */
const KMH = 3.6, MPH = 2.237;
// driver types: wanted time gap T (s), acceleration a (m/s²), comfortable braking b, minimum gap s0 (m), length (m), top speed as a fraction of the limit
const TYPES = [
  { name: "car", T: 1.3, a: 0.7, b: 1.8, s0: 2, len: 4.5, vf: 1, lapse: 1 },
  { name: "lorry", T: 1.8, a: 0.4, b: 1.5, s0: 3, len: 14, vf: 0.8, lapse: 0.6 },
  { name: "self-driving car", T: 1.6, a: 1.6, b: 1.5, s0: 3, len: 4.5, vf: 1, lapse: 0 }   // never inattentive, accelerates briskly, brakes gently and early
];
// the Intelligent Driver Model: acceleration of a driver doing v, a distance gap behind a vehicle that is slower by dv
function idm(v, gap, dv, P, vWant) {
  const want = P.s0 + Math.max(0, v * P.T + v * dv / (2 * Math.sqrt(P.a * P.b)));
  return P.a * (1 - Math.pow(v / vWant, 4) - (want / Math.max(gap, 0.5)) ** 2);

// steady flow predicted by the model if every driver were identical and perfectly steady: returns [[density per km, flow per hour]...]
function theoryCurve(limit, P = TYPES[0]) { const out = []; for (let k = 0; k <= 60; k++) { const v = limit * (1 - k / 60) * 0.999, gap = (P.s0 + v * P.T) / Math.sqrt(1 - Math.pow(v / limit, 4)), rho = 1000 / (gap + P.len); out.push([rho, rho * v * 3.6]); } out.push([1000 / (P.s0 + P.len), 0]); return out; }

  track(dt) {

  flow() { return this.density() * this.speed() * 3.6; }                               // vehicles per hour per lane = density × speed

// A run without drawing: settle for `warm` seconds, then average for `secs`. Returns { speed (km/h), flow, stopped (%), wave (km/h) }.

const cv = ui.canvas(() => { });
// the loop is a "stadium": two straights joined by two half-circles (a plain circle for the test track). pos(x, lane) gives screen position and heading.
function geom() { const w = cv.w, h = cv.h, R = Math.min(h / 2 - 34, w / 2 - 40), S = P.L === 230 ? 0 : Math.max(0, w - 2 * R - 70), per = 2 * S + 2 * Math.PI * R; return { R, S, per, cx: w / 2, cy: h / 2 + 4, ppm: per / P.L, lw: P.L === 230 ? 20 : P.L <= 1000 ? 11 : 8 }; }
function pos(G, x, lane, out) {
  let d = x * G.ppm; const R = G.R - (lane - (P.lanes - 1) / 2) * G.lw, S = G.S;   // lane 0 is the outside of the loop
  if (d < S) { out[0] = G.cx - S / 2 + d; out[1] = G.cy + R; out[2] = 0; return; } d -= S;
  const arc = Math.PI * G.R; if (d < arc) { const a = d / G.R; out[0] = G.cx + S / 2 + Math.sin(a) * R; out[1] = G.cy + Math.cos(a) * R; out[2] = -a; return; } d -= arc;
  if (d < S) { out[0] = G.cx + S / 2 - d; out[1] = G.cy - R; out[2] = Math.PI; return; } d -= S;
  const a = d / G.R; out[0] = G.cx - S / 2 - Math.sin(a) * R; out[1] = G.cy - Math.cos(a) * R; out[2] = Math.PI - a;
}
const speedCol = v => { const f = K.clamp(v / 31, 0, 1); return f < 0.5 ? `rgb(255,${Math.round(60 + 320 * f)},60)` : `rgb(${Math.round(255 - 380 * (f - 0.5))},220,${Math.round(60 + 80 * (f - .5))})`; };
function draw() {
  const c = cv.ctx, w = cv.w, h = cv.h, G = geom(), q = [0, 0, 0];
  const bg = c.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.7); bg.addColorStop(0, "#0c1420"); bg.addColorStop(1, "#05080f"); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  // tarmac and lane markings
  const path = (R) => { c.beginPath(); c.moveTo(G.cx - G.S / 2, G.cy + R); c.lineTo(G.cx + G.S / 2, G.cy + R); c.arc(G.cx + G.S / 2, G.cy, R, Math.PI / 2, -Math.PI / 2, true); c.lineTo(G.cx - G.S / 2, G.cy - R); c.arc(G.cx - G.S / 2, G.cy, R, -Math.PI / 2, Math.PI / 2, true); c.closePath(); };
  c.lineWidth = P.lanes * G.lw + 6; c.strokeStyle = "#1c222e"; path(G.R); c.stroke(); c.lineWidth = 1.2; c.strokeStyle = "rgba(230,235,245,.55)"; path(G.R + P.lanes * G.lw / 2 + 1.5); c.stroke(); path(G.R - P.lanes * G.lw / 2 - 1.5); c.stroke();
  c.setLineDash([6, 9]); c.strokeStyle = "rgba(230,235,245,.3)"; for (let l = 1; l < P.lanes; l++) { path(G.R - (l - P.lanes / 2) * G.lw); c.stroke(); } c.setLineDash([]);
  if (road.works) { c.strokeStyle = "#ff9f1c"; c.lineWidth = G.lw - 2; c.setLineDash([4, 4]); c.beginPath(); for (let x = road.works[0]; x <= road.works[1]; x += 6) { pos(G, x, P.lanes - 1, q); x === road.works[0] ? c.moveTo(q[0], q[1]) : c.lineTo(q[0], q[1]); } c.stroke(); c.setLineDash([]); pos(G, road.works[0], P.lanes + 1.2, q); c.fillStyle = "#ffb347"; c.font = "600 11px Segoe UI,sans-serif"; c.textAlign = "center"; c.fillText("lane closed", q[0], q[1]); }
  // direction arrow and a scale
  c.fillStyle = "rgba(200,212,235,.6)"; c.font = "12px Segoe UI,sans-serif"; c.textAlign = "center"; c.fillText("traffic drives this way  →", G.cx, G.cy + G.R + P.lanes * G.lw / 2 + 22); c.fillText(P.L === 230 ? "230 m round" : P.L / 1000 + " km round · " + P.lanes + " lane" + (P.lanes > 1 ? "s" : ""), G.cx, G.cy + 4);
  // vehicles: body coloured by speed, white headlights, red brake lights when slowing
  const wd = Math.max(2.4, G.lw * 0.55);
  for (const car of road.cars) {
    pos(G, car.x, car.y, q); const len = Math.max(4, car.P.len * G.ppm), braking = car.a < -0.6;
    c.save(); c.translate(q[0], q[1]); c.rotate(q[2]);
    if (braking) { c.fillStyle = "rgba(255,40,30,.35)"; c.beginPath(); c.arc(-len, 0, wd * 1.6, 0, 6.3); c.fill(); } else if (car.v > 3) { c.fillStyle = "rgba(255,245,210,.10)"; c.beginPath(); c.moveTo(0, -wd / 2); c.lineTo(len * 0.9 + 14, -wd * 1.4); c.lineTo(len * 0.9 + 14, wd * 1.4); c.lineTo(0, wd / 2); c.fill(); }
    c.fillStyle = speedCol(car.v); c.beginPath(); c.roundRect(-len, -wd / 2, len, wd, Math.min(2.5, wd / 3)); c.fill();
    if (car.type === 1) { c.fillStyle = "rgba(0,0,0,.35)"; c.fillRect(-len, -wd / 2, len * 0.72, wd); } else if (car.type === 2) { c.strokeStyle = "#7fe3ff"; c.lineWidth = 1.5; c.strokeRect(-len - 1, -wd / 2 - 1, len + 2, wd + 2); }
    if (braking) { c.fillStyle = "#ff3b2f"; c.fillRect(-len - 1, -wd / 2, 2, wd); }
    c.restore();
    if (car === tapped && car.brake > 0) { c.strokeStyle = "#fff"; c.lineWidth = 1.5; c.beginPath(); c.arc(q[0], q[1], 14, 0, 6.3); c.stroke(); }
  }
  // key
  c.textAlign = "left"; c.font = "11px Segoe UI,sans-serif"; let kx = 14; for (const [v, name] of [[0, "stopped"], [10, "slow"], [20, ""], [31, "fast"]]) { c.fillStyle = speedCol(v); c.fillRect(kx, h - 18, 16, 8); c.fillStyle = "#b9c4d8"; c.fillText(name, kx + 20, h - 10); kx += name ? 28 + c.measureText(name).width : 18; }
  if (P.auto) { c.strokeStyle = "#7fe3ff"; c.strokeRect(kx + 4, h - 19, 16, 10); c.fillText("self-driving", kx + 26, h - 10); }
}
K.pointer(cv.el, { down(p) { const G = geom(), q = [0, 0, 0]; let best = null, bd = 18; for (const car of road.cars) { pos(G, car.x, car.y, q); const d = Math.hypot(q[0] - p.x, q[1] - p.y); if (d < bd) { bd = d; best = car; } } if (best) { best.brake = 2; tapped = best; } } });

// the space–time diagram: one thin row of pixels is added every half-second, showing where the vehicles are and how fast
const stBox = K.$("div", "k-chart"); ui.dock.append(stBox); const stc = K.canvas(stBox, c => { c.ctx.fillStyle = "#0a0f1c"; c.ctx.fillRect(0, 0, c.w, c.h); });
function stRow() {
  const c = stc.ctx, w = stc.w, h = stc.h, top = 22, L0 = 44; c.drawImage(stc.el, L0 * stc.dpr, top * stc.dpr, (w - L0) * stc.dpr, (h - top - 1) * stc.dpr, L0, top + 1, w - L0, h - top - 1);
  c.fillStyle = "#0a0f1c"; c.fillRect(L0, top, w - L0, 1); for (const car of road.cars) { if (P.lanes > 1 && car.lane !== 0) continue; c.fillStyle = speedCol(car.v); c.fillRect(L0 + car.x / road.L * (w - L0 - 6), top, Math.max(1.5, car.P.len / road.L * (w - L0)), 1); }
  c.fillStyle = K.cssVar("--panel"); c.fillRect(0, 0, w, top); c.fillRect(0, 0, L0, h); c.fillStyle = K.cssVar("--text"); c.font = "600 12px Segoe UI,sans-serif"; c.textAlign = "left"; c.textBaseline = "middle"; c.fillText("Where the jams are" + (P.lanes > 1 ? " (outside lane)" : ""), L0, 11);
  c.fillStyle = K.cssVar("--muted"); c.font = "11px Segoe UI,sans-serif"; c.textAlign = "right"; c.fillText("position along the road →", w - 6, 11); c.save(); c.translate(12, h / 2 + 10); c.rotate(-Math.PI / 2); c.textAlign = "center"; c.fillText("← earlier · now ↑", 0, 0); c.restore();
}
const chF = K.chart(ui.dock, { title: "Flow against density", xLabel: "density (vehicles per km per lane)", yLabel: "flow (veh/h per lane)", yMin: 0, xMin: 0 });

// ---------------- The loop ----------------
let frame = 0;
ui.run(dt => {
  let left = rate * Math.max(dt, 1 / 120); while (left > 1e-6) { const d = Math.min(0.1, left); road.step(d); left -= d; }
  if (road.t - stLast >= 0.5) { stLast = road.t; stRow(); }
  if (road.t - fdLast >= 5) { fdLast = road.t; fd.push([road.density(), road.flow()]); if (fd.length > 400) fd.shift(); }
}, () => {
  draw(); if (frame++ % 6) return;
  const den = road.density(), v = road.speed(), wv = road.wave && road.wave.speed != null ? road.wave.speed * KMH : null;
  chF.draw([{ pts: theoryCurve(road.o.limit), color: K.cssVar("--s1"), dash: [5, 4], label: "perfectly steady drivers" }, { pts: fd, type: "dots", color: K.cssVar("--s0"), r: 2.2, alpha: .5, label: "this road, every 5 s" }, { pts: [[den, road.flow()]], type: "dots", color: K.cssVar("--s2"), r: 5.5, label: "now" }], { xMax: Math.max(100, den * 1.2) });
  read.set("den", den.toFixed(0) + " per km"); read.set("flow", road.flow().toFixed(0) + " per hour"); read.set("v", (v * KMH).toFixed(0) + " km/h (" + (v * MPH).toFixed(0) + " mph)"); read.set("stop", (road.stopped || 0) + " of " + road.cars.length);
  read.set("wave", wv == null ? "no jam" : wv.toFixed(0) + " km/h" + (wv < -2 ? " (backwards)" : "")); read.set("t", Math.floor(road.t / 60) + " min " + Math.floor(road.t % 60) + " s");
  ui.hud(`<b style="font-size:15px">${road.flow().toFixed(0)} vehicles an hour</b> per lane<br>average speed ${(v * MPH).toFixed(0)} mph · ${(road.stopped || 0)} crawling${wv != null && wv < -2 ? `<br><span style="color:#ff8a70">jam moving backwards at ${(-wv).toFixed(0)} km/h</span>` : ""}`);
});
restart();
ui.tip("Every vehicle follows one simple rule · click a car to tap its brakes", 8000);
</script>
</body></html>
