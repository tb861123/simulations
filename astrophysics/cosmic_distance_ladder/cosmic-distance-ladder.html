<!doctype html>
<!-- The Cosmic Distance Ladder: one self-contained file, works offline. Built from tools/kit (kit.css, kit.js, src/cosmic_distance_ladder.js); edit those and run "node build.js". -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Cosmic Distance Ladder</title>
<style>

.k-bchart{flex:1;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.k-bfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;height:150px;margin-top:10px}
.k-btable{overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:12.5px}

.k-btable th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600}
.k-bnote{overflow:auto;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px}
.k-bnote b{color:var(--text)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
.k-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap;background:#35505a;color:#c9ecdf}
.k-tag.adv{background:#4b3a78;color:#e3d6ff}.k-tag.beyond{background:#39465c;color:#cfdaf0}
.k-idea{font-size:13px;margin:0 0 8px;line-height:1.4}.k-spec{font-size:12px;color:var(--muted);margin:0 0 10px}
.k-pane>h3{font-size:14px;margin:14px 0 8px;color:var(--accent)}
.k-q h4{font-size:12px}.k-q .k-marks{margin-left:auto;color:var(--muted);font-weight:400}.k-q p{color:var(--text);font-size:13.5px}
.k-q details{font-size:13px;color:var(--muted)}.k-q summary{cursor:pointer;color:var(--warn)}.k-q details ul{padding-left:18px;margin:4px 0}
.k-level{padding-bottom:4px}
.k-tabs button{font-size:13px;padding-left:2px;padding-right:2px}
.k-wsrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.k-mcard .btn+.btn,.k-mcard button+button{margin-left:6px}
/* playback-speed control moved into the header (ui.headerSpeed) */
.k-hspeed{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;margin:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.k-hspeed .k-ctl{display:flex;align-items:center;gap:7px;margin:0}
.k-hspeed .k-ctl.k-hoff{display:none}
.k-hspeed .k-ctl label{display:contents}
.k-hspeed .k-ctl label span{order:0;font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}

@media (max-width:1400px){.k-blurb{display:none}.k-top{gap:10px}.k-top:has(.k-hspeed:not([style*="none"])) .k-chip{display:none}}

<script>
"use strict";
/* =====================================================================
   K: the small shared toolkit behind the ★ enhanced simulations.
   It builds the page frame (header, stage, chart dock, side panel),
   the sliders and buttons, the live charts, the Investigations cards
   and the Batch run window. Each simulation's own code (below this
   script in the page) holds the science.
   ===================================================================== */
const K = (() => {
  const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const col = i => cssVar("--s" + (i % 6));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Repeatable random numbers: the same seed always gives the same run ----
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * r()); };
    r.int = n => Math.floor(r() * n);
    r.pick = arr => arr[Math.floor(r() * arr.length)];
    return r;
  }
  // ---- Simple statistics ----
  const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
  const se = a => sd(a) / Math.sqrt(a.length || 1);
  function linfit(pts) { // least-squares straight line through [x,y] points
    const n = pts.length, mx = mean(pts.map(p => p[0])), my = mean(pts.map(p => p[1]));
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of pts) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    const m = sxy / (sxx || 1); return { m, c: my - m * mx, r: sxy / Math.sqrt((sxx * syy) || 1), n };
  }
  function download(name, text) { const a = $("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  const sig = (v, n = 3) => { if (v == null || !isFinite(v)) return "–"; if (v === 0) return "0"; const a = Math.abs(v); if (a >= 1e5 || a < 1e-3) return v.toExponential(n - 1); return String(+v.toPrecision(n)); };

  // ---- Controls ----
  /* Typing a value into a slider: read a displayed value ("2.2 mF", "4.7 × 10⁵ Pa", "£30,000", "−12 °C") as a number,
     then search the slider's positions for the one whose display matches (copes with log scales and unit prefixes). */
  const PRE = { p: 1e-12, n: 1e-9, "μ": 1e-6, "µ": 1e-6, u: 1e-6, m: 1e-3, k: 1e3, M: 1e6, G: 1e9 }, SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function parseVal(text) {
    const t = String(text).replace(/[−–]/g, "-").replace(/[   ]/g, " ");
    const m = t.match(/-?(?:\d{1,3}(?:[, ]\d{3})+|\d+)(?:\.\d+)?|-?\.\d+/);
    if (!m) return null;
    let v = parseFloat(m[0].replace(/[, ]/g, "")), rest = t.slice(m.index + m[0].length);
    const pw = m[0] === "10" && rest.match(/^(?:\^\s*(-?\d+(?:\.\d+)?)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))/);         // a bare power of ten: 10⁻⁹ or 10^6.5
    if (pw) { v = Math.pow(10, pw[1] != null ? +pw[1] : (pw[2][0] === "⁻" ? -1 : 1) * +[...pw[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join("")); rest = rest.slice(pw[0].length); }
    const ex = rest.match(/^\s*(?:[×x*]\s*10\s*(?:\^\s*(-?\d+)|(⁻?[⁰¹²³⁴⁵⁶⁷⁸⁹]+))|[eE]([-+]?\d+))/);
    if (ex) { const p = ex[1] != null ? +ex[1] : ex[3] != null ? +ex[3] : (ex[2][0] === "⁻" ? -1 : 1) * +[...ex[2].replace("⁻", "")].map(c => SUP.indexOf(c)).join(""); v *= Math.pow(10, p); rest = rest.slice(ex[0].length); }
    const wd = rest.match(/^\s*(thousand|million|billion|trillion)\b/i);    // "1 million K"
    if (wd) { v *= { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 }[wd[1].toLowerCase()]; rest = rest.slice(wd[0].length); }
    const pm = !wd && rest.match(/^\s*([pnμµumkMG])(?=[A-Za-zΩ°])/);
    if (pm) v *= PRE[pm[1]];
    return isFinite(v) ? { v, unit: rest } : null;
  }
  // what was typed, in the units on display unless a unit was typed too ("2.2", "2.2 mF" and "1e-6" all work)
  function typedVal(raw, shown) {
    const q = parseVal(raw); if (!q) return null;
    if (/[A-Za-zμµΩ°%£$€]/.test(q.unit)) return q;
    const s = parseVal(shown); return parseVal(raw + (s ? " " + s.unit.trim() : ""));
  }
  function invertSlider(lo, hi, st, g, target) {
    const n = Math.max(1, Math.round((hi - lo) / st)), pos = i => +(lo + i * st).toFixed(10);
    let e0 = 0, e1 = n;                                                       // ends may show words ("off"): step in to the first numbers
    while (e0 < n && g(pos(e0)) == null && e0 < 60) e0++;
    while (e1 > e0 && g(pos(e1)) == null && n - e1 < 60) e1--;
    const a = g(pos(e0)), b = g(pos(e1));
    if (a == null || b == null || a === b) return null;
    const up = b > a;
    if (up ? target < a : target > a) return pos(e0 > 0 ? 0 : e0);
    if (up ? target > b : target < b) return pos(e1 < n ? n : e1);
    let i0 = e0, i1 = e1, v0 = a, v1 = b;
    while (i1 - i0 > 1) { const im = (i0 + i1) >> 1, vm = g(pos(im)); if (vm == null) break; if ((vm < target) === up) { i0 = im; v0 = vm; } else { i1 = im; v1 = vm; } }
    return Math.abs(v0 - target) <= Math.abs(v1 - target) ? pos(i0) : pos(i1);
  }

  notes: `<h3>The model</h3>
<ul><li><b>Radar:</b> circular orbits for Venus, Earth and Mars, all lined up on day 0. Kepler's third law gives each distance in AU; a radar pulse gives it in km (d = ct/2) with a random timing error; 1 AU = d(km) ÷ d(AU), averaged over the pulses. A planet within 6° of the Sun (behind it) cannot be measured.</li>
<li><b>Parallax:</b> measured parallax = true (1000/d mas) + a random error of the instrument's size (Bessel 20 mas, Hipparcos 1 mas, Gaia 0.025 mas); d = 1/p, using our radar AU as the baseline.</li>
<li><b>Cepheids:</b> Leavitt's law M = −2.43(log₁₀P − 1) − 4.05 with 0.15 mag real scatter. 40 Milky Way Cepheids 300–3000 pc away, with parallaxes, fix the zero point (the slope is taken as known). In a galaxy, a Cepheid is found only if its mean magnitude is brighter than the telescope's limit; the measuring error grows near the limit. Near the limit only the brighter-than-average Cepheids of each period are found (Malmquist bias), so only periods whose Cepheids should all be at least 0.5 mag brighter than the limit are used. The distance modulus is the weighted mean of m − M.</li>
<li><b>Supernovae:</b> peak M = −19.3 − 2(s − 1) + 0.12 mag scatter, where the stretch s (spread 0.15) says how slowly it fades. The stretch correction uses the measured s. Calibrated in up to 16 galaxies that also have Cepheids (distances like the SH0ES team's), then used for up to 200 supernovae spread evenly through space.</li>
<li><b>Hubble's law:</b> v = H₀d + the galaxy's own (peculiar) motion + 20 km/s measuring error; speed from the red-shift v = cz. Weighted straight-line fit through the origin; the quoted uncertainty adds the calibration errors of the lower rungs. Age ≈ 977.8 ÷ H₀ billion years.</li></ul>
<h3>Simplifications</h3>
<ul><li>Circular, flat planetary orbits; no light-travel or atmospheric effects on radar.</li>
<li>One parallax measurement per star; no Lutz–Kelker or Malmquist bias corrections (though they appear by themselves at large errors).</li>
<li>Dust (A level) dims Cepheids and supernovae in the same galaxy equally; real dust is corrected using colours.</li>
<li>Low red-shift only (v = cz); no cosmic acceleration, K-corrections or metallicity effects. Real Cepheid work uses infrared light; the Milky Way calibration also uses other anchors (the LMC's eclipsing binaries, the maser galaxy NGC 4258).</li>
<li>Galaxies are drawn the same size on screen whatever their distance (as if zoomed in).</li></ul>
<h3>Other rungs</h3>
<p>Real astronomers also use main-sequence fitting of star clusters, eclipsing binaries, the tip of the red giant branch, masers, the Tully–Fisher relation and gravitational-wave "standard sirens". The Hubble tension (67.4 from Planck v 73 from the ladder) is one of the big open questions in cosmology.</p>`

// ---------------- Controls ----------------
const ctl = {}, grp = {};
const VIEWS = [["ladder", "🪜 The ladder"], ["radar", "📡 Radar"], ["parallax", "🌍 Parallax"], ["cepheid", "✨ Cepheids"], ["sn", "💥 Supernovae"], ["hubble", "🌈 Hubble's law"]];
let g = ui.group("Rung of the ladder");

ui.headerSpeed(ctl.speed);

// Parallax
grp.parallax = g = ui.group("Parallax");
ctl.star = K.slider(g, { label: "Distance of the star", min: 0.1, max: 4.3, step: 0.01, value: P.star, fmt: v => fmtDist(10 ** v) + " (" + fmtLy(10 ** v) + ")", on: v => { P.star = v; plog = []; } });
ctl.preset = K.seg(g, { value: null, options: STARS.map(([n, d]) => [d, n.replace(" (a Cepheid)", "")]), on: v => { ctl.star.set(Math.log10(v), true); } });
ctl.inst = K.seg(g, { label: "Instrument", value: "gaia", options: Object.entries(INST).map(([k, o]) => [k, o.name.replace(/ (telescope|satellite)/, "")]), on: v => { P.inst = v; plog = []; recompute(); } });
K.note(g, "The instrument also measures the Milky Way Cepheids that calibrate the next rung.");
rr = K.row(g); K.btn(rr, "📏 Measure now", () => measureParallax(), "primary"); K.btn(rr, "Clear", () => plog = []);
const rdP = K.readout(g, [["p", "parallax angle p (true)"], ["d", "distance d = 1/p"], ["e", "uncertainty"], ["n", "measurements (one a year)"]]);
// Cepheids

ctl.nCeph = K.slider(g, { label: "Cepheids looked for in each galaxy", min: 5, max: 60, step: 1, value: 25, on: v => { P.nCeph = v; cSel = -1; recompute(); } });

const rdH = K.readout(g, [["H", "H₀ fitted"], ["age", "age 1/H₀"], ["zT", "far galaxy: d = cz ÷ H₀"], ["n", "supernovae used"]]);
const advOnly = [ctl.zp, ctl.dust, ctl.stretch];

function recompute(newClimb) { L = climb(P); if (newClimb && isFinite(L.H)) climbs.push(L.H); if (climbs.length > 60) climbs.shift(); if (snPick >= L.flow.length) snPick = 0; }
function setView(v) {
  P.view = v; ctl.view.set(v); for (const k in grp) grp[k].style.display = k === v ? "" : "none";
  chC.el.style.display = v === "cepheid" ? "" : "none"; ui.mission(null);
}
function applyLevel() { const adv = ui.level === "adv"; for (const c of advOnly) c.el.style.display = adv ? "" : "none"; if (!adv && (P.zp || P.dust || !P.stretch)) { P.zp = 0; P.dust = 0; P.stretch = true; ctl.zp.set(0); ctl.dust.set(0); ctl.stretch.set(true); recompute(); } }
ui.onLevel = applyLevel;
function set(o) {
  const keep = P.view; P = Object.assign(P0(), o); if (!o.view) P.view = keep;
  for (const k of ["sigT", "star", "nCeph", "nCal", "zp", "dust", "nHost", "H0", "nSN", "dmax", "vpec", "zT"]) ctl[k].set(P[k]);
  ctl.tgt.set(P.tgt); ctl.inst.set(P.inst); ctl.gal.set(P.gal); ctl.tel.set(P.tel); ctl.stretch.set(P.stretch);
  plog = []; cSel = -1; snPick = 0; pulse = null; climbs = []; recompute(true); setView(P.view);
}

// ---------------- Actions ----------------
function sendPulse() {

K.pointer(cv.el, {
  down: p => {
    if (P.view === "ladder") { const hit = hits.find(b => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1); if (hit) setView(hit.id); }
    else if (P.view === "cepheid") { let best = -1, bd = 300; for (const [x, y, i] of cephSpots) { const dd = (x - p.x) ** 2 + (y - p.y) ** 2; if (dd < bd) { bd = dd; best = i; } } if (best >= 0) cSel = best; }
    else if (P.view === "radar") sendPulse();
  },
  hover: p => { if (P.view !== "ladder") return; const hit = hits.find(b => p.x >= b.x0 && p.x <= b.x1 && p.y >= b.y0 && p.y <= b.y1); hover = hit ? hit.id : null; cv.el.style.cursor = hit ? "pointer" : ""; },
  leave: () => { hover = null; }
});

// ---------------- The loop ----------------
let frame = 0;
ui.run(dt => {
  if (!(dt > 0)) return; const s = dt * speed;
  T.day += 30 * s; const y0 = Math.floor(T.year); T.year += 0.25 * s; if (P.view === "parallax" && Math.floor(T.year) > y0) measureParallax();
  T.ceph += 3 * s; T.sn += 8 * s; if (T.sn > 75) T.sn = -20;
  if (pulse) { pulse.q += dt / 2.5; if (pulse.q >= 1) { P.pulses.push(pulse.res); if (P.pulses.length > 30) P.pulses.shift(); pulse = null; recompute(); } }
}, () => {
  const c = cv.ctx, w = cv.w, h = cv.h; c.fillStyle = "#05070f"; c.fillRect(0, 0, w, h);
  ({ ladder: drawLadder, radar: drawRadar, parallax: drawParallax, cepheid: drawCepheid, sn: drawSupernova, hubble: drawHubble })[P.view](c, w, h);
  if (frame++ % 5 === 0) charts();
});
applyLevel(); set({});
ui.tip("Click a rung of the ladder to open it, or use the buttons in Controls.", 7000);
</script>
</body></html>
