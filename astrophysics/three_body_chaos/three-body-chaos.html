<style>
  #viewBar { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; align-self: center; }
  #viewBar button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  #viewBar button.on { border-color: var(--accent); }
  #viewBar .vbKey { opacity: .55; font-size: 11px; margin-left: 4px; }
  /* bigger, clearer drag handles between the panels */
  .splitter::before { width: 4px !important; margin-left: -2px !important; }

  }, true);
  document.addEventListener("keydown", e => {
    const t = e.target.tagName; if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "f" || e.key === "F") { full(); e.preventDefault(); }
    else if (e.key === "[") bL.click(); else if (e.key === "]") bR.click();
  });
  // A one-time tip so people notice the panels can be hidden or resized
  let seen = false; try { seen = localStorage.getItem("sims-viewbar-tip") === "1"; } catch (e) {}
  if (!seen) {
    const tip = document.createElement("div"); tip.id = "vbTip";
    tip.innerHTML = "<b>Make the simulation bigger:</b> hide the side panels with the buttons above (or the yellow ‹ › tabs), drag the ⋮ bars to resize them, or press <b>⛶ Full screen</b>. Click to close.";
    document.body.appendChild(tip);
    const close = () => { tip.remove(); try { localStorage.setItem("sims-viewbar-tip", "1"); } catch (e) {} };
    tip.onclick = close; setTimeout(close, 12000);
  }
})();
</script>
<!-- VIEW BAR (end) -->
</body></html>
