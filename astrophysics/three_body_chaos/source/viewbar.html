<!-- VIEW BAR (start): hide/show the side panels and full-screen the simulation. Same block in every simulation. -->
<style>
  #viewBar { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-shrink: 0; align-self: center; }
  #viewBar button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  #viewBar button.on { border-color: var(--accent); }
  #viewBar .vbKey { opacity: .55; font-size: 11px; margin-left: 4px; }
  /* bigger, clearer drag handles between the panels */
  .splitter::before { width: 4px !important; margin-left: -2px !important; }
  .splitter::after { content: "⋮"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 16px; pointer-events: none; }
  .splitter button { width: 22px !important; height: 52px !important; font-size: 15px !important; font-weight: 700; background: var(--accent) !important; color: #14133b !important; border: none !important; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  /* full screen: the centre panel fills the screen */
  #centre:fullscreen { background: var(--bg); padding: 10px; width: 100vw; height: 100vh; box-sizing: border-box; }
  #centre .vbExit { display: none; }
  #centre:fullscreen .vbExit { display: block; position: absolute; top: 10px; right: 12px; z-index: 50; }
  #centre:fullscreen { position: relative; }
  #vbTip { position: fixed; top: 52px; right: 14px; z-index: 60; max-width: 330px; background: var(--panel-2, #1b2017); border: 1px solid var(--accent);
           border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,.5); cursor: pointer; }
</style>
<script>
(function () {
  // Buttons in the header: hide/show the left (controls) and right (readouts) panels, and full screen.
  // They click the existing ‹ › buttons on the drag handles, so each simulation's own layout code stays in charge.
  const header = document.querySelector("header"), centre = document.getElementById("centre");
  const sL = document.getElementById("splitL"), sR = document.getElementById("splitR");
  const left = sL && sL.previousElementSibling, right = sR && sR.nextElementSibling;   // the panels either side of the drag handles
  const bL = sL && sL.querySelector("button"), bR = sR && sR.querySelector("button");
  if (!header || !centre || !left || !right || !bL || !bR) return;
  const bar = document.createElement("div"); bar.id = "viewBar";
  bar.innerHTML = '<button id="vbL" title="Hide or show the controls panel (key: [ )"></button>' +
                  '<button id="vbR" title="Hide or show the readouts panel (key: ] )"></button>' +
                  '<button id="vbF" title="Show only the simulation, full screen (key: F; Esc to leave)">⛶ Full screen</button>';
  header.appendChild(bar);
  const exit = document.createElement("button"); exit.className = "vbExit"; exit.textContent = "✕ Exit full screen (Esc)";
  centre.appendChild(exit);
  const vbL = bar.querySelector("#vbL"), vbR = bar.querySelector("#vbR"), vbF = bar.querySelector("#vbF");
  function label() {
    const lc = left.classList.contains("collapsed"), rc = right.classList.contains("collapsed");
    vbL.textContent = lc ? "◧ Show controls" : "◧ Hide controls"; vbL.classList.toggle("on", !lc);
    vbR.textContent = rc ? "Show readouts ◨" : "Hide readouts ◨"; vbR.classList.toggle("on", !rc);
  }
  new MutationObserver(label).observe(left, { attributes: true, attributeFilter: ["class"] });
  new MutationObserver(label).observe(right, { attributes: true, attributeFilter: ["class"] });
  label();
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (centre.requestFullscreen) centre.requestFullscreen().catch(() => {}); };
  vbL.onclick = () => bL.click(); vbR.onclick = () => bR.click(); vbF.onclick = full; exit.onclick = full;
  document.addEventListener("fullscreenchange", () => {
    vbF.textContent = document.fullscreenElement ? "✕ Exit full screen" : "⛶ Full screen";
    setTimeout(() => window.dispatchEvent(new Event("resize")), 60);    // canvases re-measure themselves
  });
  // The batch-run window lives outside the full-screen area, so leave full screen when it is opened
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("button");
    if (document.fullscreenElement && b && /Batch run/.test(b.textContent)) document.exitFullscreen();
  }, true);
  document.addEventListener("keydown", e => {
    const t = e.target.tagName; if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "f" || e.key === "F") { full(); e.preventDefault(); }
    else if (e.key === "[") bL.click(); else if (e.key === "]") bR.click();
  });
  // A one-time tip so people notice the panels can be hidden or resized
  let seen = false; try { seen = localStorage.getItem("sims-viewbar-tip") === "1"; } catch (e) {}
  if (!seen) {
    const tip = document.createElement("div"); tip.id = "vbTip";
    tip.innerHTML = "<b>Make the simulation bigger:</b> hide the side panels with the buttons above (or the yellow ‹ › tabs), drag the ⋮ bars to resize them, or press <b>⛶ Full screen</b>. Click to close.";
    document.body.appendChild(tip);
    const close = () => { tip.remove(); try { localStorage.setItem("sims-viewbar-tip", "1"); } catch (e) {} };
    tip.onclick = close; setTimeout(close, 12000);
  }
})();
</script>
<!-- VIEW BAR (end) -->
